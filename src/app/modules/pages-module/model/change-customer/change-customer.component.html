<section [style]="style_obj_change_customer">
<div class="modal-header">
    <h3 class="panel-title mb-0 " style="font-size: 18px; font-weight: 500">
        <span class="head-img"><img src="assets/icons/add_order2.svg" /></span>
        <span class="align-text-top">{{ "SELECT_CUSTOMER" | translate }}</span>
    </h3>

    <button type="button" (click)="add_New_Customer()"
        class="ml-auto btn btn-primary btn-with-icon save-profile globleSVGColorButtonChnage">
        <svg class="btn-icon-width" id="Layer_1" data-name="Layer 1" xmlns="http://www.w3.org/2000/svg"
            viewBox="0 0 100 100">
            <defs>
                <style>
                    .cls-1 {
                        fill: #fff;
                    }
                </style>
            </defs>
            <path class="cls-1"
                d="M96.09,46.09H53.91V3.91a3.91,3.91,0,1,0-7.82,0V46.09H3.91a3.91,3.91,0,1,0,0,7.82H46.09V96.09a3.91,3.91,0,0,0,7.82,0V53.91H96.09a3.91,3.91,0,0,0,0-7.82Z" />
        </svg>&nbsp;{{ "ADD_CUSTOMER" | translate }}
    </button>

    <button type="button" class="btn btn-primary btn-with-icon save-profile ml-0" aria-label="Close"
        (click)="modal.dismiss('Cross click')">
        X
    </button>

</div>

<div class="modal-body modal-content">
    <div>
        <div class="form-group pull-right pr-1">
            <input type="search" (search)="clearSearch()" class="form-control form-control-alternative"
                placeholder="Search" #searchevt />
        </div>
    </div>

    <div class="viewbilltable cus-scrl">
        <div class="row flex-row pr-3 pl-3">
            <div *ngFor="let item of customerList | paginate
            : {
                itemsPerPage: tableSize,
                currentPage: page,
                totalItems: customercount
              };
        let i = index" class="custom-col">
                <div class="hmpage-most-pop-pbox onScrlWrap" (click)="addposorder(item)">
                    <div class="hm-imgwrap">
                        <div class="itemThemb">

                            <img *ngIf="item.user_picture != null && item.user_picture.length > 0"
                                class="item-image onScrl" [src]="item.user_picture">
                            <img class="item-image onScrl material-icons"
                                *ngIf="item.user_picture == null || item.user_picture.length == 0" alt=""
                                [src]="getInitials(item.name)">
                        </div>
                    </div>
                    <div class="content-font">
                        <div class="display-name">
                            <b>{{item.name}}</b>
                        </div>
                        <div class="display-phone">
                            <b>{{item.phone}}</b>
                        </div>
                    </div>
                </div>
            </div>
        </div>

    </div>

    <div *ngIf="no_data">
        <h3 class="no-record-found">{{ "NO_RECORD_FOUNDS" | translate }}</h3>
    </div>
    <div *ngIf="!no_data" class="d-flex justify-content-center">
        <div class="item-count">
            {{ "TOTAL_ITEMS" | translate }}: {{ customercount }}
        </div>
        <pagination-controls *ngIf="customercount>tableSize" previousLabel="Prev" nextLabel="Next"
            (pageChange)="GetStoreCustomerList($event)">
        </pagination-controls>
    </div>

</div>
</section>
