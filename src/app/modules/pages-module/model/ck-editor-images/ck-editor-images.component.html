<div class="container-fluid mt-3" *ngIf="parentUrl && imageList.length !=0">
    <div *ngIf="imageList.length !=0" class="row">
        <div class="col-sm-2 mb-4" *ngFor="let images of imageList">
            <a href="javascript:void()" (click)="onSelect(images.url)">
                <img class="w-100" style="height:191px;object-fit: contain; border:1px solid rgb(204, 204, 204)"
                    [src]="images.url" [alt]="images.fileName">
            </a>
        </div>
    </div>
</div>

<div *ngIf="parentUrl && imageList.length ==0" class="row">
    <div class="col-md-12">
        <h1 class="fw-bolder fs-4x text-gray-700 mb-10 no-img"> No Image Found</h1>
    </div>
</div>

<div class="container-fluid mt-3" *ngIf="!parentUrl">
    <div class="row">
        <h1 class="fw-bolder fs-4x text-gray-700 mb-10">Page Not Found</h1>
        <div class="fw-bold fs-3 text-gray-400 mb-15">
            The page you looked not found!
        </div>
    </div>
</div>
