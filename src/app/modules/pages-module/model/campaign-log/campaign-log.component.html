<div class="modal-header">
  <!-- <span class="head-img"><img style="width: 24px;" src="assets/icons/subscription_payment.svg"></span> -->
  <h3 class="panel-title mb-0 p-0 align-text-top" style="margin: 0 !important;font-size: 18px;">
    {{ "CAMPAIGN_LOG" | translate }}
  </h3>
  <button type="button" class="close" aria-label="Close" (click)="activeModal.dismiss('Cross click')">
    <span aria-hidden="true" style="font-size: 24px;">&times;</span>
  </button>
</div>
<div class="modal-body">
 
  <div class="cusDetail">
    <table class="table">
      <thead>
        <tr>
          <th>{{ "DATE" | translate }}</th>
          <th>{{ "TIME" | translate }}</th>
          <th>{{ "COUNT" | translate }}</th>
          <th>{{ "ACTION" | translate }}</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let log of logList">
          <td>{{ log.date }}</td>
          <td>{{ log.time }}</td>
          <td>{{ log.count }}</td>
          <td>
            <span class="cursor-pointer">
              <a (click)="DownloadLog(log)"><i style="font-size: 20px;line-height: 2;"
                  class="fa fa-download" aria-hidden="true"></i></a>
            </span>
          </td>
        </tr>
      </tbody>
    </table>

  </div>
 
  <div *ngIf="!no_data" class="d-flex justify-content-center">
    <div class="item-count" [hidden]="logList.length == 0">
      {{ "TOTAL_ITEMS" | translate }}: {{ logList.length }}
    </div>
  </div>
  <div *ngIf="logList.length == 0">
    <h3 class="no-record-found">{{ "NO_RECORD_FOUNDS" | translate }}</h3>
  </div>

</div>
