<section [style]="style_obj_payment_details">
<div class="modal-header">
    <!-- <span class="head-img"><img style="width: 24px;" src="assets/icons/subscription_payment.svg"></span> -->
    <h4 class="panel-title mb-0 p-0 align-text-top" style="margin: 0 !important">
        {{ "VIEW_PAYMENT" | translate }} ({{khataList.order_name}})
    </h4>
    <button type="button" class="btn btn-primary btn-with-icon save-profile ml-0" aria-label="Close"
        (click)="activeModal.dismiss('Cross click')">
        X
    </button>
</div>

<div class="modal-body">
    <div class="row">
        <div class="col-xl-12 col-lg-12 col-md-12 col-12">
            <div class="payment-details-model-top">
                <div class="payment-details-model-top-left">
                    <img *ngIf=" paymentList.user_picture != null && paymentList.user_picture.length > 0"
                        [src]="paymentList.user_picture" alt="">
                    <img *ngIf=" paymentList.user_picture == null || paymentList.user_picture.length == 0 "
                        [src]="getInitials(paymentList.name ? paymentList.name : 'null ')" alt="">
                    <div>
                        <a [href]="'tel:'+paymentList?.phone">
                            <svg _ngcontent-LokalypaymentListtomerApp-c151="" xmlns="http://www.w3.org/2000/svg"
                                version="1.1" id="Layer_1" x="0px" y="0px" viewBox="0 0 58.791 58.791"
                                xml:space="preserve" style="enable-background: new 0 0 58.791 58.791;">
                                <g _ngcontent-LokalyCustomerApp-c151="">
                                    <ellipse _ngcontent-LokalyCustomerApp-c151=""
                                        transform="matrix(0.9525 -0.3045 0.3045 0.9525 -7.5545 10.3458)" cx="29.395"
                                        cy="29.396" rx="29.395" ry="29.396" style="fill: #39A935;"></ellipse>
                                    <path _ngcontent-LokalyCustomerApp-c151=""
                                        d="M44.319,37.946l-6.376-4.252c-0.81-0.535-1.894-0.359-2.491,0.405l-1.857,2.388   c-0.239,0.315-0.673,0.406-1.019,0.214l-0.353-0.195c-1.17-0.638-2.628-1.433-5.564-4.37c-2.935-2.937-3.732-4.395-4.37-5.564   l-0.194-0.353c-0.195-0.345-0.104-0.781,0.21-1.021l2.387-1.857c0.763-0.598,0.938-1.683,0.405-2.492l-4.252-6.375   c-0.548-0.824-1.649-1.072-2.494-0.562l-2.668,1.602c-0.838,0.493-1.451,1.29-1.715,2.226c-0.96,3.498-0.238,9.535,8.656,18.43   c7.074,7.074,12.341,8.976,15.959,8.976c0.835,0.003,1.664-0.105,2.469-0.322c0.936-0.262,1.733-0.877,2.226-1.715l1.603-2.665   C45.392,39.595,45.143,38.495,44.319,37.946z"
                                        style="fill: #FFFFFF;"></path>
                                </g>
                            </svg>
                        </a>

                    </div>
                </div>
                <div class="payment-details-model-top-right">
                    <h4>
                        <span>{{paymentList.name}}</span>
                        <img src="./assets/icons/isregister_image.svg" alt="">
                    </h4>
                    <div *ngIf="allow_khata == 1">
                        <h5>Credit Time: {{paymentList.number}} {{paymentList.unit_name}} ({{paymentList.remaining_days}}
                            remaining)</h5>
                        <h6>Overdue Limit: {{paymentList.remaining_overdue_amount}} remaining</h6>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <div class="row">
        <div class="col-xl-12 col-lg-12 col-md-12 col-12 order-details-modal">
            <ul>
                <li>
                    <label for="">Date</label>
                    <input type="text" disabled="disabled" class="form-control" placeholder="{{khataList.date}}">
                </li>
                <li>
                    <label for="">Amount</label>
                    <input type="text" disabled="disabled" class="form-control" placeholder="{{khataList.amount}}">
                </li>
                <li>
                    <label for="">Payment Method</label>
                    <textarea name="" disabled="disabled" id="" cols="30" rows="3" class="form-control"
                        placeholder="{{khataList.remarks}}"></textarea>
                </li>
            </ul>
        </div>
    </div>
</div>
<div class="modal-footer">
    <button type="button" class="btn btn-primary btn-with-icon save-profile ml-0" aria-label="Close"
        (click)="activeModal.dismiss('Cross click')">
        Ok
    </button>
</div>
</section>
