<section [style]="style_obj_rearrange_items">
<div class="modal-header">
  <h3 class="panel-title mb-0 p-0">
    <span> {{ "REARRANGE_CATEGORY" | translate }} </span>
  </h3>
  <button type="button" class="btn-close btn btn-primary btn-with-icon save-profile" aria-label="Close"
    (click)="modal.dismiss()">
    X
  </button>
</div>
<div class="modal-body">
  <div class="col-md-12">
    <button class="btn btn-primary" type="button" (click)="editCategoryOrder()" [disabled]="categoryList.length == 0">
      <i class="fa fa-check"> </i> {{ "SAVE" | translate }}
    </button>
    <span>{{ "REARRANGE_TEXT" | translate }}</span>
  </div>
  <div class="col-md-12">
    <div class="panel panel-info mt-3">
      <div class="btn-primary" style="height: 50px;">
        <h3 class="ml-2" style="font-size: 18px;
        padding-top: 12px;">{{ "CATEGORY_TYPE_LIST" | translate }}
        </h3>
      </div>
      <div class="panel-body" *ngIf="categoryList.length > 0">
        <ul class="category-list" cdkDropList (cdkDropListDropped)="drop($event)">
          <li class="category-box alternetColor" *ngFor="let app of categoryList" cdkDrag>
            <div class="category-custom-placeholder" *cdkDragPlaceholder>
              <span class="cat-name">
                {{ app.category_name }}
              </span>
              <span class="appspan alternetColor"> {{ app.count }}</span>
            </div>
            <span class="cat-name">
              {{ app.category_name }}
            </span>
            <span class="appspan alternetColor"> {{ app.count }}</span>
          </li>
        </ul>
      </div>
      <div *ngIf="categoryList.length == 0">
        <h3 class="no-record-found ng-binding">
          {{ "NO_RECORD_FOUNDS" | translate }}
        </h3>
      </div>
    </div>
  </div>
</div>
<div class="modal-footer">
  <button class="btn btn-primary" type="button" (click)="editCategoryOrder()" [disabled]="categoryList.length == 0">
    <i class="fa fa-check"> </i> {{ "SAVE" | translate }}
  </button>
</div>
</section>
