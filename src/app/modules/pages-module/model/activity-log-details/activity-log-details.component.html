<section [style]="style_obj_activity_log">
  <div class="modal-header">
    <h3 class="panel-title mb-0 p-0">
      <span class="head-img"><img class="w-30px" src="assets/icons/activity_logs.svg" /></span>
      <span class="align-text-top"> {{ "ACTIVITY_LOGS" | translate}}</span>
    </h3>
    <span class="pull-right">
      <button
        type="button"
        class="pull-right close"
        aria-label="Close"
        (click)="activeModal.dismiss('Cross click')"
      >
        <span aria-hidden="true">&times;</span>
      </button>
    </span>
  </div>
  <br />
  
  <div class="panel-body" style="margin-left: 1cm">
    <div class="row">
      <div class="col-md-12">
        <div class="form-group row clearfix">
          <label for="name" class="col-sm-3 control-label">{{
            "USER_NAME" | translate
          }}</label>
          <div class="col-md-9" *ngIf="remove_link == false">
            <label for="name" class="control-label" *ngIf="!isKhataUser">
              <span class="cursor-pointer">
                <a
                  style="color: #666666; text-decoration-line: initial !important"
                  (click)="editSeller(license.user_id, license.store_id)"
                  ><b>{{ license.user_name }} ({{ license.store_name }})</b></a
                ></span
              ></label
            >
            <label for="name" class="control-label" *ngIf="isKhataUser">{{
              license.user_name
            }}</label>
          </div>
  
          <div class="col-md-9" *ngIf="remove_link == true">
            <label for="name" class="control-label">{{
              license.user_name
            }}</label>
          </div>
        </div>
        <div class="form-group row clearfix">
          <label for="name" class="col-sm-3 control-label">{{
            "LOG_DESCRIPTION" | translate
          }}</label>
          <div class="col-md-9">
            <label for="name" class="control-label">{{
              license.log_description
            }}</label>
          </div>
        </div>
        <div class="form-group row clearfix">
          <label for="name" class="col-sm-3 control-label">{{
            "CREATED_ON" | translate
          }}</label>
          <div class="col-md-9">
            <label for="name" class="control-label"
              >{{ license.created_on }} {{ global_timezone }}</label
            >
          </div>
        </div>
        <div class="form-group row clearfix">
          <label for="name" class="col-sm-3 control-label">{{
            "IP_ADDRESS" | translate
          }}</label>
          <div class="col-md-9">
            <label for="name" class="control-label">{{
              license.ip_address
            }}</label>
          </div>
        </div>
      </div>
    </div>
    <div class="form-group col-md-12 pull-right">
      <span class="pull-right">
        <button
          class="btn btn-primary"
          type="button"
          (click)="activeModal.dismiss('Cross click')"
        >
          {{ "OK" | translate }}
        </button>
      </span>
    </div>
  </div>
  </section>
