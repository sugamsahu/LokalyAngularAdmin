<section [style]="style_obj_add_addons">
<div class="modal-header">
  <h3 class="panel-title mb-0 p-0">
    <span class="head-img"><img src="assets/icons/add_variant.svg" /></span>
    <span class="align-text-top">{{ "CHOOSE_ADDON_TO_ADD" | translate }}</span>
  </h3>
  <button
    type="button"
    class="btn-close btn btn-primary btn-with-icon save-profile"
    aria-label="Close"
    (click)="modal.dismiss('Cross click')"
  >
    X
  </button>
</div>
<div class="modal-body">
  <div class="col-md-12">
    <div class="panel panel-info mt-3">
      <div class="row">
        <div class="col-xlg-12 col-lg-12 col-md-12 col-sm-12 col-xs-12">
          <div class="panel-body">
            <div class="row">
              <div class="col-md-12">
                <div class="form-group row clearfix">
                  <div class="col-md-2"></div>
                  <div class="col-md-6">
                    <ng-select
                      [(ngModel)]="selectedAddOn"
                      placeholder="{{ 'SELECT_ADDON' | translate }}"
                      [searchable]="false"
                      [multiple]="false"
                      [clearable]="false"
                      [disabled]="
                        masterAddOnList == undefined ||
                        masterAddOnList == null ||
                        masterAddOnList.length <= 0
                      "
                      (change)="changeAddOn($event)"
                    >
                      <ng-option
                        *ngFor="let option1 of masterAddOnList"
                        [value]="option1.addon_id"
                      >
                        {{ option1.addon_name }}
                      </ng-option>
                    </ng-select>
                  </div>
                </div>
              </div>
              <div class="col-md-12">
                <div class="form-group row clearfix">
                  <div class="col-md-2"></div>
                  <div class="col-md-6">
                    <button
                      type="button"
                      (click)="saveMasterAddOn()"
                      class="btn btn-primary btn-with-icon save-profile"
                    >
                      <i class="fa fa-plus-circle"></i>
                      {{ "ADD" | translate }}
                    </button>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
</section>
