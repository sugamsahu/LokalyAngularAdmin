<section [style]="style_obj_add_note">
    <div class="modal-header">
        <h3 *ngIf="!for_url" class="panel-title mb-0 p-0">
            <span class="head-img"><img src="assets/icons/ic_add_note.svg" /></span>

            <span class="align-text-top"> {{ item.item_name }} </span>
            <span class="align-text-top" *ngIf="item.unit_name != '' && item.unit_name != null">
                ({{ item.unit_quantity }}-{{ item.unit_name }})
            </span>
            <span class="align-text-top" *ngIf="item.packaging_name != null && item.packaging_name != ''">
                ({{ item.packaging_name }})
            </span>
        </h3>
        <h3 *ngIf="for_url" class="panel-title mb-0 p-0">
            <span class="align-text-top">
                {{help_details?.title ? help_details?.title: "ADD_VIDEO_URL" | translate }}
            </span>
            <img *ngIf="help_details?.is_active==1 && (help_details?.module_value || help_details?.attachment)"
                class="help-details-img-css" title="{{ '' | translate }}"
                src="assets/img/newdash/information-dark.svg" alt="information"
                (click)="openHelpInfoModel('dashboard')" />
        </h3>

        <button type="button" class="close" aria-label="Close" (click)="activeModal.dismiss('Cross click')">
            <span aria-hidden="true">&times;</span>
        </button>
    </div>

    <!-- Note section -->
    <div *ngIf="!for_url" class="modal-body">
        <div class="col-md-12">
            <div class="form-group row clearfix">
                <div class="col-sm-12">
                    <ng-container *ngFor="let item of category_tag_name">
                        <button *ngIf="item"
                            class="btn btn-primary btn-with-icon save-profile globleSVGColorButtonChnage" type="button"
                            (click)="AddNote(item)">
                            {{ item }}
                        </button>
                    </ng-container>
                </div>
            </div>
            <div class="form-group row clearfix">
                <div class="col-sm-12">
                    <textarea type="text" rows="4" cols="50" name="note" [(ngModel)]="note"
                        class="form-control form-control-alternative" placeholder="{{ 'NOTE' | translate }}"
                        maxlength="500"></textarea>
                </div>
            </div>
        </div>

        <div class="col-md-12">
            <div class="form-group row clearfix">
                <div class="col-sm-3"></div>
                <div class="col-sm-8">
                    <button class="btn btn-white cancelbtn" type="button" (click)="clear()">
                        <img class="btn-icon-width" src="assets/icons/button/reject.svg" />&nbsp;
                        {{ "CLEAR" | translate }}
                    </button>
                    <button type="button" class="btn btn-primary btn-with-icon save-profile globleSVGColorButtonChnage"
                        (click)="submitNote()">
                        <svg class="btn-icon-width" id="Layer_1" data-name="Layer 1" xmlns="http://www.w3.org/2000/svg"
                            viewBox="0 0 100 100">
                            <defs>
                                <style>
                                    .cls-1 {
                                        fill: #fff;
                                    }
                                </style>
                            </defs>
                            <path class="cls-1"
                                d="M77.78,0H11.11A11.1,11.1,0,0,0,0,11.11V88.89A11.1,11.1,0,0,0,11.11,100H88.89A11.1,11.1,0,0,0,100,88.89V22.22ZM50,88.89A16.67,16.67,0,1,1,66.67,72.22,16.68,16.68,0,0,1,50,88.89ZM66.67,33.33H11.11V11.11H66.67Z" />
                        </svg>&nbsp;{{ "SAVE" | translate }}
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- URl section -->
    <div *ngIf="for_url" class="modal-body">
        <div class="col-md-12">
            <div class="form-group row clearfix">
                <div class="col-sm-12">
                    <input type="text" name="url" [(ngModel)]="url" class="form-control form-control-alternative"
                        placeholder="{{ 'URL' | translate }}">
                </div>
            </div>
        </div>

        <div class="col-md-12">
            <div class="row clearfix">
                <div class="col-sm-3"></div>
                <div class="col-sm-8">
                    <button class="btn btn-white cancelbtn" type="button" (click)="clear()">
                        <img class="btn-icon-width" src="assets/icons/button/reject.svg" />&nbsp;
                        {{ "CLEAR" | translate }}
                    </button>
                    <button type="button" class="btn btn-primary btn-with-icon save-profile globleSVGColorButtonChnage"
                        (click)="submitNote()">
                        <svg class="btn-icon-width" id="Layer_1" data-name="Layer 1" xmlns="http://www.w3.org/2000/svg"
                            viewBox="0 0 100 100">
                            <defs>
                                <style>
                                    .cls-1 {
                                        fill: #fff;
                                    }
                                </style>
                            </defs>
                            <path class="cls-1"
                                d="M77.78,0H11.11A11.1,11.1,0,0,0,0,11.11V88.89A11.1,11.1,0,0,0,11.11,100H88.89A11.1,11.1,0,0,0,100,88.89V22.22ZM50,88.89A16.67,16.67,0,1,1,66.67,72.22,16.68,16.68,0,0,1,50,88.89ZM66.67,33.33H11.11V11.11H66.67Z" />
                        </svg>&nbsp;{{ "SAVE_URL" | translate }}
                    </button>
                </div>
            </div>
        </div>
    </div>
</section>
