<section [style]="style_obj_confirm_password">
<div class="modal-header" style="margin-top: -8px; border: none;">
    <h3 class="modal-title fw-bold" style="margin-left: 2px; font-size:18px;color:black;">
        {{'CONFIRM_YOUR_PASSWORD'|translate}}
    </h3>
    <span class="pull-right">
        <button type="button" class="pull-right close" aria-label="Close" (click)="activeModal.dismiss('Cross click')">
            <span aria-hidden="true">&times;</span>
        </button>
    </span>
</div>
<div class="modal-body mt--25px">
    <form [formGroup]="passwordSubmit" (ngSubmit)="ConfirmPassword()" class="pt-2">
        <div class="row">
            <div class="col-md-12">
                <div class="form-group row clearfix">
                    <div class="col-md-12">
                        <input type="password" id="password" name="password" #cursor
                            class="form-control form-control-alternative" formControlName="password" required
                            placeholder="{{'PASSWORD'|translate}}">
                        <div class="errormessage" *ngIf="controlHasError('required', 'password')">
                        </div>

                    </div>
                </div>
            </div>
        </div>

        <div class="col-md-12">
            <div class="form-group row clearfix">
                <button type="submit" [disabled]="passwordSubmit.invalid" data-toggle="modal"
                    data-backdrop="static" data-keyboard="false"
                    class="btn btn-primary btn-with-icon submitButton save-profile globleSVGColorButtonChnage float-left">
                    {{'SUBMIT'|translate}}
                </button>

            </div>
        </div>
    </form>
</div>
</section>
