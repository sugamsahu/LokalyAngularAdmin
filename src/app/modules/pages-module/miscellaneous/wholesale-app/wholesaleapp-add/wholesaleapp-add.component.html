<div class="header bg-gradient-danger pt-0 pt-md-0 header-bg-gradient-space">
  <div class="container-fluid">
    <div class="header-body"></div>
  </div>
</div>
<div class="container-fluid container-body-space">
  <div class="row">
    <div class="col-12">
      <div class="card shadow">
        <div class="card-header border-0 d-flex flex-wrap justify-content-between align-items-center">
          <h3 class="panel-title mb-0">
            <span class="head-img"><img src="assets/icons/wholesale_addedit.svg" /></span>
            <span class="align-text-top">{{ "WHOLESALE_MARKET_APP" | translate }}</span>
          </h3>
          <a class="globleSVGColorButtonChnageReply back-btn" (mousedown)="cancelClick()">
            <svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" id="Capa_1"
              x="0px" y="0px" width="55px" height="45px" viewBox="0 0 612 612"
              style="enable-background: new 0 0 612 612" xml:space="preserve">
              <g>
                <g>
                  <g id="reply-all">
                    <path
                      d="M178.5,191.25v-76.5L0,293.25l178.5,178.5v-76.5l-102-102L178.5,191.25z M331.5,216.75v-102L153,293.25l178.5,178.5V367.2    C459,367.2,548.25,408,612,497.25C586.5,369.75,510,242.25,331.5,216.75z"
                      data-original="#000000" class="active-path" data-old_color="#24c9fc" fill="#24c9fc" />
                  </g>
                </g>
              </g>
            </svg>
          </a>
        </div>
        <form [formGroup]="formGroup" (ngSubmit)="onSubmit()">
          <div class="col-md-12">
            <div class="form-group row clearfix">
              <div class="col-md-2">
                <label for="inputname" class="control-label">{{
                  "NAME" | translate
                  }}</label>
              </div>
              <div class="col-sm-4">
                <input type="text" name="inputname" formControlName="user_name"
                  class="form-control form-control-alternative" readonly placeholder="{{ 'NAME' | translate }}" />
              </div>
            </div>
          </div>

          <div class="col-md-12">
            <div class="form-group row clearfix">
              <div class="col-md-2">
                <label for="inputFirstName" class="control-label">{{
                  "PHONE" | translate
                  }}</label>
              </div>
              <div class="col-sm-4">
                <input type="text" formControlName="user_phone" placeholder="{{ 'PHONE' | translate }}" readonly
                  class="form-control form-control-alternative" maxlength="500" />
              </div>
            </div>
          </div>

          <div class="col-md-12">
            <div class="form-group row clearfix">
              <div class="col-md-2">
                <label for="inputFirstName" class="control-label">{{
                  "EMAIL" | translate
                  }}</label>
              </div>
              <div class="col-sm-4">
                <input type="text" formControlName="user_email" placeholder="{{ 'EMAIL' | translate }}" readonly
                  class="form-control form-control-alternative" maxlength="500" />
              </div>
            </div>
          </div>

          <div class="col-md-12">
            <div class="form-group row clearfix">
              <div class="col-md-2">
                <label for="inputFirstName" class="control-label">{{
                  "IMAGE" | translate
                  }}</label>
              </div>
              <div class="col-sm-4">
                <div class="userpic">
                  <div class="userpic-wrapper bg-666666">
                    <img [src]="formGroup.value.picture" />
                  </div>
                </div>
              </div>
            </div>
          </div>
          <div class="col-md-12">
            <div class="form-group row clearfix">
              <div class="col-md-2">
                <label for="inputBusiness" class="control-label">{{
                  "BUSINESS_NAME" | translate
                  }}</label>
              </div>
              <div class="col-sm-4">
                <input type="text" formControlName="business_name" placeholder="{{ 'BUSINESS_NAME' | translate }}"
                  readonly class="form-control form-control-alternative" maxlength="500" />
              </div>
            </div>
          </div>

          <div class="col-md-12">
            <div class="form-group row clearfix">
              <div class="col-md-2">
                <label for="inputtax" class="control-label">{{
                  "TAX_NUMBER" | translate
                  }}</label>
              </div>
              <div class="col-sm-4">
                <input type="text" formControlName="tax_number" placeholder="{{ 'TAX_NUMBER' | translate }}" readonly
                  class="form-control form-control-alternative" maxlength="500" />
              </div>
            </div>
          </div>

          <div class="col-md-12">
            <div class="form-group row clearfix">
              <div class="col-md-2">
                <label for="inputHouse" class="control-label">{{
                  "HOUSE_APARTMENT_NAME" | translate
                  }}</label>
              </div>
              <div class="col-sm-4">
                <input type="text" formControlName="address1" placeholder="{{ 'HOUSE_APARTMENT_NAME' | translate }}"
                  readonly class="form-control form-control-alternative" maxlength="500" />
              </div>
            </div>
          </div>

          <div class="col-md-12">
            <div class="form-group row clearfix">
              <div class="col-md-2">
                <label for="inputStreetName" class="control-label">{{
                  "STREET_NAME" | translate
                  }}</label>
              </div>
              <div class="col-sm-4">
                <input type="text" formControlName="address2" placeholder="{{ 'STREET_NAME' | translate }}" readonly
                  class="form-control form-control-alternative" maxlength="500" />
              </div>
            </div>
          </div>
          <div class="col-md-12">
            <div class="form-group row clearfix">
              <div class="col-md-2">
                <label for="inputArea" class="control-label">{{
                  "AREA" | translate
                  }}</label>
              </div>
              <div class="col-sm-4">
                <input type="text" formControlName="area_name" placeholder="{{ 'AREA' | translate }}" readonly
                  class="form-control form-control-alternative" maxlength="500" />
              </div>
            </div>
          </div>
          <div class="col-md-12">
            <div class="form-group row clearfix">
              <div class="col-md-2">
                <label for="inputZipcode" class="control-label">
                  {{ pincode_label }}</label>
              </div>
              <div class="col-sm-4">
                <input type="text" formControlName="zipcode" placeholder="{{ pincode_label }}" readonly
                  class="form-control form-control-alternative" maxlength="10" />
              </div>
            </div>
          </div>
          <div class="col-md-12">
            <div class="form-group row clearfix">
              <div class="col-md-2">
                <label for="inputCity" class="control-label">{{
                  "CITY" | translate
                  }}</label>
              </div>
              <div class="col-sm-4">
                <input type="text" formControlName="city_name" placeholder="{{ 'CITY' | translate }}" readonly
                  class="form-control form-control-alternative" maxlength="500" />
              </div>
            </div>
          </div>
          <div class="col-md-12">
            <div class="form-group row clearfix">
              <div class="col-md-2">
                <label for="inputState" class="control-label">{{
                  "STATE" | translate
                  }}</label>
              </div>
              <div class="col-sm-4">
                <input type="text" formControlName="state_name" placeholder="{{ 'STATE' | translate }}" readonly
                  class="form-control form-control-alternative" maxlength="500" />
              </div>
            </div>
          </div>
          <div class="col-md-12">
            <div class="form-group row clearfix">
              <div class="col-md-2">
                <label for="inputCountry" class="control-label">{{
                  "COUNTRY" | translate
                  }}</label>
              </div>
              <div class="col-sm-4">
                <input type="text" formControlName="country_name" placeholder="{{ 'COUNTRY' | translate }}" readonly
                  class="form-control form-control-alternative" maxlength="500" />
              </div>
            </div>
          </div>
          <div class="col-md-12">
            <div class="form-group row clearfix">
              <div class="col-md-2">
                <label for="inputBusiness" class="control-label">{{
                  "REMARKS" | translate
                  }}</label>
              </div>
              <div class="col-sm-4">
                <textarea type="text" formControlName="remarks" placeholder="{{ 'REMARKS' | translate }}"
                  class="form-control form-control-alternative" maxlength="500">
                </textarea>
              </div>
            </div>
          </div>
          <div class="col-md-12">
            <div class="form-group row clearfix">
              <div class="col-md-2">
                <label for="inputSTATUS" class="control-label">{{ "STATUS" | translate }}
                </label>
              </div>
              <div class="col-sm-4 custom-dropdown-status">
                <ng-select [searchable]="true" [clearable]="false" formControlName="selectedStatus" name="inputSTATUS"
                  id="uiOrderStatus" (change)="ChangeStatus($event)">
                  <ng-option *ngFor="let item of statusList" [value]="item">
                    {{ item.label }}
                  </ng-option>
                </ng-select>
              </div>
            </div>
          </div>

          <div class="col-md-12">
            <div class="form-group row clearfix">
              <div class="col-md-2"></div>
              <div class="col-md-4">
                <button class="btn btn-white cancelbtn" type="button" (mousedown)="cancelClick()">
                  <img class="btn-icon-width" src="assets/icons/button/reject.svg" />&nbsp;{{ "CANCEL" | translate }}
                </button>
                <button type="submit" class="btn btn-primary btn-with-icon save-profile globleSVGColorButtonChnage">
                  <svg class="btn-icon-width" id="Layer_1" data-name="Layer 1" xmlns="http://www.w3.org/2000/svg"
                    viewBox="0 0 100 100">
                    <defs>
                      <style>
                        .cls-1 {
                          fill: #fff;
                        }
                      </style>
                    </defs>
                    <path class="cls-1"
                      d="M77.78,0H11.11A11.1,11.1,0,0,0,0,11.11V88.89A11.1,11.1,0,0,0,11.11,100H88.89A11.1,11.1,0,0,0,100,88.89V22.22ZM50,88.89A16.67,16.67,0,1,1,66.67,72.22,16.68,16.68,0,0,1,50,88.89ZM66.67,33.33H11.11V11.11H66.67Z" />
                  </svg>&nbsp;{{ "SAVE" | translate }}
                </button>
              </div>
            </div>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
