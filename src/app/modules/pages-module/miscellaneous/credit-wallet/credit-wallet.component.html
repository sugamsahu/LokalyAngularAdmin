<div class="header bg-gradient-danger pt-0 pt-md-0 header-bg-gradient-space">
    <div class="container-fluid">
        <div class="header-body"></div>
    </div>
</div>
<div class="container-fluid container-body-space">
    <div class="row">
        <div class="col-12">
            <div class="card shadow">
                <div class="card-header border-0 d-flex flex-wrap justify-content-between align-items-center">
                    <h3 class="panel-title mb-0">
                        <span class="head-img"><img src="assets/icons/credit_wallet.svg" /></span>
                        <span class="align-text-top">
                            {{help_details?.title ? help_details?.title: "CREDIT_WALLET" | translate }}
                        </span>
                        <img *ngIf="help_details?.is_active==1 && (help_details?.module_value || help_details.attachment)"
                            class="help-details-img-css" title="{{ 'STORE_DASHBOARD_HELP' | translate }}"
                            src="assets/img/newdash/information-dark.svg" alt="information"
                            (click)="openHelpInfoModel('dashboard')" />
                    </h3>
                </div>
                <br>
                <form [formGroup]="formGroup" (ngSubmit)="onSubmit()">
                    <div class="col-md-12">
                        <div class="form-group row clearfix">
                            <div class="col-md-2">
                                <label for="inputMobile" class="control-label">{{ "CUSTOMER_MOBILE" | translate}}
                                    <span class="required">*</span>
                                </label>
                            </div>
                            <div class="col-sm-4">
                                <input type="text" #cursor name="customerMobile" required
                                    formControlName="customerMobile" class="form-control form-control-alternative"
                                    placeholder="{{ 'CUSTOMER_MOBILE' | translate }}" maxlength="10"
                                    id="userProfilePhone1" (keyup)="changeNumber()" />
                                <div class="errormessage" *ngIf="controlHasError('required', 'customerMobile')">
                                    {{ "PLEASE_ENTER_PHONE_NUMBER" | translate }}
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="col-md-12">
                        <div class="form-group row clearfix">
                            <div class="col-md-2">
                                <label for="" class="control-label">{{ "NAME" | translate}}</label>
                            </div>
                            <div class="col-sm-4">
                                <input type="text" formControlName="name" placeholder="{{'NAME'|translate}}" disabled
                                    class="form-control form-control-alternative" name="name" maxlength="500" />
                            </div>
                        </div>
                    </div>

                    <div class="col-md-12">
                        <div class="form-group row clearfix">
                            <div class="col-md-2">
                                <label for="" class="control-label">{{ "EMAIL" | translate}}</label>
                            </div>
                            <div class="col-sm-4">
                                <input type="text" formControlName="email" placeholder="{{'EMAIL'|translate}}" disabled
                                    class="form-control form-control-alternative" name="email" />
                            </div>
                        </div>
                    </div>


                    <div class="col-md-12">
                        <div class="form-group row clearfix">
                            <div class="col-md-2">
                                <label for="" class="control-label">{{ "CREDIT_DATE" |
                                    translate}}</label>
                            </div>
                            <div class="col-sm-4">
                                <input type="text" formControlName="creditDate"
                                    placeholder="{{'CREDIT_DATE'|translate}}" disabled
                                    class="form-control form-control-alternative" name="creditDate" />
                            </div>
                        </div>
                    </div>

                    <div class="col-md-12">
                        <div class="form-group row clearfix">
                            <div class="col-md-2">
                                <label for="inputMobile" class="control-label">{{ "WALLET_AMOUNT" | translate}}
                                    <span class="required">*</span>
                                </label>
                            </div>
                            <div class="pr-0 fw-bold w-0" style="right: 16px;top: 8px">
                                {{global_currency}}
                            </div>
                            <div class="col-sm-4">
                                <input type="text" formControlName="walletAmount"
                                    (keypress)="commonService.validateDecimal($event)" (keyup)="validateFloatNumber()"
                                    placeholder="{{'WALLET_AMOUNT'|translate}}"
                                    class="form-control form-control-alternative" id="walletAmount" required
                                    name="walletAmount" />
                                <div class="errormessage" *ngIf="controlHasError('required', 'walletAmount')">
                                    {{ "PLEASE_ENTER_WALLET_AMOUNT" | translate }}
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="col-md-12">
                        <div class="form-group row clearfix">
                            <div class="col-md-2">
                                <label for="inputFirstName" class="control-label">{{ "DESCRIPTION" |
                                    translate}}</label>
                            </div>
                            <div class="col-sm-4">
                                <textarea type="text" formControlName="description" required
                                    placeholder="{{'DESCRIPTION'|translate}}"
                                    class="form-control form-control-alternative" maxlength="500">
                                </textarea>
                                <div class="errormessage" *ngIf="controlHasError('required', 'description')">
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="col-md-12">
                        <div class="form-group row clearfix">
                            <div class="col-md-2"></div>
                            <div class="col-md-4">

                                <button type="button" (click)="clearForm()"
                                    class="btn btn-primary btn-with-icon save-profile">
                                    <i title="clear" class="fa fa-times mr-1" style="font-size: 18px;"></i>{{ "CLEAR" |
                                    translate }}
                                </button>

                                <button type="submit"
                                    class="btn btn-primary btn-with-icon save-profile globleSVGColorButtonChnage">
                                    <svg class="btn-icon-width" id="Layer_1" data-name="Layer 1"
                                        xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
                                        <defs>
                                            <style>
                                                .cls-1 {
                                                    fill: #fff;
                                                }
                                            </style>
                                        </defs>
                                        <path class="cls-1"
                                            d="M77.78,0H11.11A11.1,11.1,0,0,0,0,11.11V88.89A11.1,11.1,0,0,0,11.11,100H88.89A11.1,11.1,0,0,0,100,88.89V22.22ZM50,88.89A16.67,16.67,0,1,1,66.67,72.22,16.68,16.68,0,0,1,50,88.89ZM66.67,33.33H11.11V11.11H66.67Z" />
                                    </svg>&nbsp;{{ "SAVE" | translate }}
                                </button>
                            </div>
                        </div>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
