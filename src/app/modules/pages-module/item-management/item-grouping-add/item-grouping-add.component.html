
<div class="header bg-gradient-danger pt-0 pt-md-0 header-bg-gradient-space">
  <div class="container-fluid">
    <div class="header-body"></div>
  </div>
</div>
<!-- Page content -->
<section id="item-grouping-add-main">
  <div class="container-fluid">
    <div class="row">
      <div class="col-lg-12">
        <div class="common-card-mobile-space card shadow">
          <div class="card-header border-0 d-flex flex-wrap justify-content-between align-items-center">
            <h3 class="panel-title mb-0">
              <span class="head-img">
                <img src="assets/icons/add_group.svg" />
              </span>
              <span class="align-text-top" *ngIf="item_group_id > 0">
                {{ "EDIT_ITEM_GROUP" | translate }}
              </span>
              <span class="align-text-top" *ngIf="item_group_id == undefined">
                {{ "CREATE_ITEM_GROUP" | translate }}
              </span>
            </h3>
            <a class="globleSVGColorButtonChnageReply back-btn" (mousedown)="cancelClick()">
              <svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" id="Capa_1"
                x="0px" y="0px" width="55px" height="45px" viewBox="0 0 612 612"
                style="enable-background: new 0 0 612 612" xml:space="preserve">
                <g>
                  <g>
                    <g id="reply-all">
                      <path
                        d="M178.5,191.25v-76.5L0,293.25l178.5,178.5v-76.5l-102-102L178.5,191.25z M331.5,216.75v-102L153,293.25l178.5,178.5V367.2    C459,367.2,548.25,408,612,497.25C586.5,369.75,510,242.25,331.5,216.75z"
                        data-original="#000000" class="active-path" data-old_color="#24c9fc" fill="#24c9fc" />
                    </g>
                  </g>
                </g>
              </svg>
            </a>
          </div>
          <form class="form" [formGroup]="formGroup" (submit)="onSubmit()" *ngIf="formGroup">
            <div class="m-20px">
              <div class="row margin-bottom-15px">
                <div class="col-xl-2 col-lg-2 col-md-2 col-12">
                  <label for="name" class="control-label">{{ "ITEM_GROUP_NAME" | translate
                    }}<span class="required">*</span></label>
                </div>
                <div class="col-xl-4 col-lg-4 col-md-4 col-12">
                  <input type="text" #cursor name="name" formControlName="group_name"
                    class="form-control form-control-alternative" placeholder="{{ 'ITEM_GROUP_NAME' | translate }}" />
                  <div class="errormessage"
                    *ngIf="formGroup.controls.group_name.status=='INVALID' ? controlHasError('required', 'group_name') :''">
                    {{ "PLEASE_ENTER_ITEM_GROUP_NAME" | translate }}
                  </div>
                </div>
              </div>
              <div class="row margin-bottom-15px">
                <div class="col-xl-2 col-lg-2 col-md-2 col-12">
                  <label for="items" class="control-label">
                    {{ "SELECT_ITEMS" | translate }}
                    <span class="required">*</span>
                  </label>
                </div>
                <div class="col-xl-4 col-lg-4 col-md-4 col-12">
                  <button type="button" class="btn btn-primary btn-with-icon save-profile globleSVGColorButtonChnage"
                    (click)="openSelectItem()">
                    <svg class="btn-icon-width" id="Layer_1" data-name="Layer 1" xmlns="http://www.w3.org/2000/svg"
                      viewBox="0 0 100 100">
                      <defs>
                        <style>
                          .cls-1 {
                            fill: #fff;
                          }
                        </style>
                      </defs>
                      <path class="cls-1" d="M50,37.36A13.64,13.64,0,1,0,63.64,51,13.66,13.66,0,0,0,50,37.36Z" />
                      <path class="cls-1"
                        d="M50,16.91A53.76,53.76,0,0,0,0,51a53.71,53.71,0,0,0,100,0A53.74,53.74,0,0,0,50,16.91Zm0,56.82A22.73,22.73,0,1,1,72.73,51,22.75,22.75,0,0,1,50,73.73Z" />
                    </svg>
                    &nbsp; {{ "VIEW_SELECT_DESELECT_ITEMS" | translate }} ({{
                    selecteditems.length
                    }})
                  </button>
                </div>
              </div>              
              <div class="row margin-bottom-15px">
                <div class="col-xl-2 col-lg-2 col-md-2 col-12">
                  <label for="inputDesc" class="control-label">
                    {{ "DESCRIPTION" | translate }}
                  </label>
                </div>
                <div class="col-xl-4 col-lg-4 col-md-4 col-12">
                  <textarea formControlName="description" placeholder="{{ 'DESCRIPTION' | translate }}"
                    class="form-control" maxlength="500"></textarea>
                </div>
              </div>
              <div class="row margin-bottom-15px">
                <div class="col-xl-2 col-lg-2 col-md-2 col-12"></div>
                <div class="col-xl-4 col-lg-4 col-md-4 col-12">
                  <button class="btn btn-white cancelbtn" type="button" (mousedown)="cancelClick()">
                    <img class="btn-icon-width" src="assets/icons/button/reject.svg" />&nbsp; {{ "CANCEL" | translate }}
                  </button>
                  <button type="submit" [disabled]="isStoreManager && !AllowManageItem"
                    class="btn btn-primary btn-with-icon save-profile globleSVGColorButtonChnage">
                    <svg class="btn-icon-width" id="Layer_1" data-name="Layer 1" xmlns="http://www.w3.org/2000/svg"
                      viewBox="0 0 100 100">
                      <defs>
                        <style>
                          .cls-1 {
                            fill: #fff;
                          }
                        </style>
                      </defs>
                      <path class="cls-1"
                        d="M77.78,0H11.11A11.1,11.1,0,0,0,0,11.11V88.89A11.1,11.1,0,0,0,11.11,100H88.89A11.1,11.1,0,0,0,100,88.89V22.22ZM50,88.89A16.67,16.67,0,1,1,66.67,72.22,16.68,16.68,0,0,1,50,88.89ZM66.67,33.33H11.11V11.11H66.67Z" />
                    </svg>
                    &nbsp; {{ "SAVE" | translate }}
                  </button>
                </div>
              </div>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</section>
