<div class="header header-bg-gradient-space bg-gradient-danger pt-0 pt-md-0">
  <div class="container-fluid">
    <div class="header-body"></div>
  </div>
</div>
<!-- Page content -->
<section id="banner-setting-add-main">
  <div class="container-fluid">
    <!-- Table -->
    <div class="row">
      <div class="col-12">
        <div class="common-card-mobile-space card shadow">
          <div class="card-header border-0 d-flex flex-wrap justify-content-between align-items-center">
            <h3 class="panel-title mb-0">
              <span class="head-img"><img src="assets/icons/manage_banner.svg" /></span>
              <span class="align-text-top" *ngIf="bannerid == 0">{{ "ADD_BANNER" | translate }}</span>
              <span class="align-text-top" *ngIf="bannerid != 0">{{ "EDIT_BANNER" | translate }}</span>
            </h3>
            <a class="globleSVGColorButtonChnageReply back-btn" (mousedown)="cancelClick()">
              <svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1"
                id="Capa_1" x="0px" y="0px" width="55px" height="45px" viewBox="0 0 612 612"
                style="enable-background: new 0 0 612 612" xml:space="preserve">
                <g>
                  <g>
                    <g id="reply-all">
                      <path
                        d="M178.5,191.25v-76.5L0,293.25l178.5,178.5v-76.5l-102-102L178.5,191.25z M331.5,216.75v-102L153,293.25l178.5,178.5V367.2    C459,367.2,548.25,408,612,497.25C586.5,369.75,510,242.25,331.5,216.75z"
                        data-original="#000000" class="active-path" data-old_color="#24c9fc" fill="#24c9fc" />
                    </g>
                  </g>
                </g>
              </svg>
            </a>
          </div>
          <form [formGroup]="formGroup" (ngSubmit)="onSubmit()">
            <div class="col-md-12">
              <br />
              <div class="form-group row clearfix">
                <div class="col-md-2">
                  <label for="inputFirstName" class="control-label">{{
                    "SELECT_BANNER" | translate
                    }}</label>
                </div>
                <div class="col-sm-5">
                  <div class="fileinput fileinput-new input-group" data-provides="fileinput">
                    <div class="userpic">
                      <div class="userpic-wrapper bg-666666">
                        <img *ngIf="!is_cropped_image" [src]="formGroup.value.picture"
                          (click)="openUpdateUserProfPicModal()" />
                        <img (click)="openUpdateUserProfPicModal()" *ngIf="is_cropped_image"
                          [src]="cropped_item_image" />
                      </div>
                      <i class="ion-ios-close-outline" (click)="removeLogoImage()"></i>
                      <a class="change-userpic" (click)="openUpdateUserProfPicModal()">{{ "CHANGE_BANNER_IMAGE" |
                        translate }}</a>
                    </div>

                    <span class="pt-1 col-red f-12px">
                      Note: {{"WIDTH_1125PX_HEIGHT_422PX"| translate}}</span>
                    <br />
                  </div>
                </div>
              </div>

              <div class="form-group row clearfix">
                <div class="col-sm-2">
                  <label for="inputCategory" class="control-label">
                    {{ "DISPLAY_SEQ" | translate }}
                  </label>
                </div>

                <div class="col-sm-4">
                  <input type="number" #cursor min="0" [value]="formGroup.value.display_id" formControlName="display_id"
                    placeholder="{{ 'DISPLAY_SEQ' | translate }}" class="form-control" name="displaysq"
                    (change)="changeseq()" oninput="this.value = 
                          !!this.value && Math.abs(this.value) >= 0 ? Math.abs(this.value) : null" />
                </div>
              </div>
            </div>
            <div class="col-md-12">
              <div class="form-group row clearfix">
                <div class="col-md-2"></div>
                <div class="col-md-4">
                  <button class="btn btn-white cancelbtn" type="button" (mousedown)="cancelClick()">
                    <img class="btn-icon-width" src="assets/icons/button/reject.svg" />&nbsp;{{ "CANCEL" | translate }}
                  </button>
                  <button [disabled]="formGroup.invalid" type="submit"
                    class="btn btn-primary btn-with-icon save-profile globleSVGColorButtonChnage">
                    <svg class="btn-icon-width" id="Layer_1" data-name="Layer 1" xmlns="http://www.w3.org/2000/svg"
                      viewBox="0 0 100 100">
                      <defs>
                        <style>
                          .cls-1 {
                            fill: #fff;
                          }
                        </style>
                      </defs>
                      <path class="cls-1"
                        d="M77.78,0H11.11A11.1,11.1,0,0,0,0,11.11V88.89A11.1,11.1,0,0,0,11.11,100H88.89A11.1,11.1,0,0,0,100,88.89V22.22ZM50,88.89A16.67,16.67,0,1,1,66.67,72.22,16.68,16.68,0,0,1,50,88.89ZM66.67,33.33H11.11V11.11H66.67Z" />
                    </svg>&nbsp;{{ "SAVE" | translate }}
                  </button>
                </div>
              </div>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</section>
