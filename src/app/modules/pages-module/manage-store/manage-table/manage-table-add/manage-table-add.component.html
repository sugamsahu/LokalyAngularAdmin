<div class="header header-bg-gradient-space bg-gradient-danger pt-0 pt-md-0">
  <div class="container-fluid">
    <div class="header-body"></div>
  </div>
</div>
<!-- Page content -->
<section id="add-manage-table-main">
  <div class="container-fluid">
    <!-- Table -->
    <div class="row">
      <div class="col-12">
        <div class="common-card-mobile-space card shadow">
          <div class="card-header border-0 d-flex flex-wrap justify-content-between align-items-center">
            <h3 class="panel-title mb-0">
              <span class="head-img"><img src="assets/icons/payment_setup.svg" /></span>
              <span class="align-text-top" *ngIf="table_id == 0">{{ "ADD_TABLE" | translate }}</span>
              <span class="align-text-top" *ngIf="table_id != 0">{{ "EDIT_TABLE" | translate }}</span>
            </h3>
            <a class="globleSVGColorButtonChnageReply back-btn" (mousedown)="cancelClick()">
              <svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1"
                id="Capa_1" x="0px" y="0px" width="55px" height="45px" viewBox="0 0 612 612"
                style="enable-background: new 0 0 612 612" xml:space="preserve">
                <g>
                  <g>
                    <g id="reply-all">
                      <path
                        d="M178.5,191.25v-76.5L0,293.25l178.5,178.5v-76.5l-102-102L178.5,191.25z M331.5,216.75v-102L153,293.25l178.5,178.5V367.2    C459,367.2,548.25,408,612,497.25C586.5,369.75,510,242.25,331.5,216.75z"
                        data-original="#000000" class="active-path" data-old_color="#24c9fc" fill="#24c9fc" />
                    </g>
                  </g>
                </g>
              </svg>
            </a>
          </div>
          <form class="manage-table-form-padding" [formGroup]="formGroup" (ngSubmit)="onSubmit()">
            <div class="row margin-bottom-1rem">
              <div class="col-xl-2 col-lg-2 col-md-2 col-12">
                <label for="inputStoreName" class="control-label">{{ "TABLE_NUMBER" | translate
                  }}<span class="required">*</span></label>
              </div>
              <div class="col-xl-4 col-lg-4 col-md-4 col-12">
                <input type="text" #cursor required name="table_no" formControlName="table_no"
                  class="form-control form-control-alternative" placeholder="{{ 'TABLE_NUMBER' | translate }}"
                  (keypress)="keyPressNumbers($event)" />
                <div class="errormessage" *ngIf="controlHasError('required', 'table_no')">
                  {{ "PLEASE_ENTER_TABLE_NUMBER" | translate }}
                </div>
              </div>
            </div>
            <div class="row margin-bottom-1rem">
              <div class="col-xl-2 col-lg-2 col-md-2 col-12">
                <label for="inputStoreName" class="control-label">{{ "CAPACITY" | translate
                  }}<span class="required">*</span></label>
              </div>
              <div class="col-xl-4 col-lg-4 col-md-4 col-12">
                <input type="number" required name="capacity" formControlName="capacity"
                  class="form-control form-control-alternative" placeholder="{{ 'CAPACITY' | translate }}" />
                <div class="errormessage" *ngIf="controlHasError('required', 'capacity')">
                  {{ "PLEASE_ENTER_CAPACITY" | translate }}
                </div>
              </div>
            </div>
            <div class="row margin-bottom-1rem">
              <div class="col-xl-2 col-lg-2 col-md-2 col-12">
                <label for="inputStoreName" class="control-label">{{
                  "DESCRIPTION" | translate
                  }}</label>
              </div>
              <div class="col-xl-4 col-lg-4 col-md-4 col-12">
                <textarea type="text" name="description" formControlName="description"
                  class="form-control form-control-alternative" maxlength="500"
                  placeholder="{{ 'DESCRIPTION' | translate }}">
                </textarea>
              </div>
            </div>
            <div class="row margin-bottom-1rem">
              <div class="col-xl-2 col-lg-2 col-md-2 col-12">
                <label for="inputStoreName" class="control-label">
                  {{ "ACTIVE" | translate }}
                </label>
              </div>
              <div class="col-xl-4 col-lg-4 col-md-4 col-12">
                <input type="checkbox" class="cursor-pointer" formControlName="is_active" />
              </div>
            </div>
            <div class="row margin-bottom-1rem">
              <div class="col-xl-2 col-lg-2 col-md-2 col-12"></div>
              <div class="col-xl-4 col-lg-4 col-md-4 col-12">
                <button class="btn btn-white cancelbtn" type="button" (mousedown)="cancelClick()">
                  <img class="btn-icon-width" src="assets/icons/button/reject.svg" />&nbsp;{{ "CANCEL" | translate }}
                </button>
                <button type="submit" class="btn btn-primary btn-with-icon save-profile globleSVGColorButtonChnage">
                  <svg class="btn-icon-width" id="Layer_1" data-name="Layer 1" xmlns="http://www.w3.org/2000/svg"
                    viewBox="0 0 100 100">
                    <defs>
                      <style>
                        .cls-1 {
                          fill: #fff;
                        }
                      </style>
                    </defs>
                    <path class="cls-1"
                      d="M77.78,0H11.11A11.1,11.1,0,0,0,0,11.11V88.89A11.1,11.1,0,0,0,11.11,100H88.89A11.1,11.1,0,0,0,100,88.89V22.22ZM50,88.89A16.67,16.67,0,1,1,66.67,72.22,16.68,16.68,0,0,1,50,88.89ZM66.67,33.33H11.11V11.11H66.67Z" />
                  </svg>&nbsp;{{ "SAVE" | translate }}
                </button>
              </div>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</section>
