<div class="header bg-gradient-danger pt-0 pt-md-0 header-bg-gradient-space">
  <div class="container-fluid">
    <div class="header-body"></div>
  </div>
</div>

<div class="container-fluid container-body-space">
  <!-- Table -->
  <div class="row">
    <div class="col-12">
      <div class="card shadow">
        <div class="card-header border-0 d-flex flex-wrap justify-content-between align-items-center">
          <h3 class="panel-title mb-0">
            <span class="head-img"><img src="assets/icons/item_attribute_add.svg" /></span>
            <span class="align-text-top" *ngIf="!item_attribute_id">{{"CREATE_ITEM_ATTRIBUTE" | translate}}</span>
            <span class="align-text-top" *ngIf="item_attribute_id">{{"EDIT_ITEM_ATTRIBUTE" | translate}}</span>
          </h3>
          <a class="globleSVGColorButtonChnageReply back-btn" (mousedown)="cancelClick()">
            <svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" id="Capa_1"
              x="0px" y="0px" width="55px" height="45px" viewBox="0 0 612 612"
              style="enable-background: new 0 0 612 612" xml:space="preserve">
              <g>
                <g>
                  <g id="reply-all">
                    <path
                      d="M178.5,191.25v-76.5L0,293.25l178.5,178.5v-76.5l-102-102L178.5,191.25z M331.5,216.75v-102L153,293.25l178.5,178.5V367.2    C459,367.2,548.25,408,612,497.25C586.5,369.75,510,242.25,331.5,216.75z"
                      data-original="#000000" class="active-path" data-old_color="#24c9fc" fill="#24c9fc" />
                  </g>
                </g>
              </g>
            </svg>
          </a>
        </div>
        <form class="form" [formGroup]="itemAttributeForm" (submit)="onSubmit()">
          <div class="m-20px">
            <div class="row">
              <div class="col-md-12">
                <br />

                <div class="form-group row clearfix">
                  <div class="col-md-2">
                    <label for="name" class="control-label">{{ "ITEM_ATTRIBUTE" | translate
                      }}<span class="required">*</span></label>
                  </div>

                  <div class="col-sm-4">
                    <input type="text" #cursor name="attribute_name" formControlName="attribute_name"
                      class="form-control form-control-alternative" placeholder="{{ 'ATTRIBUTE_NAME' | translate }}" />
                    <div class="errormessage" *ngIf="controlHasError('required', 'attribute_name')">
                      {{ "ENTER_ATTRIBUTE_NAME" | translate }}
                    </div>
                  </div>
                </div>

                <div class="form-group row clearfix">
                  <div class="col-md-2">
                    <label for="name" class="control-label">{{
                      "DESCRIPTION" | translate
                      }}</label>
                  </div>
                  <div class="col-sm-4">
                    <textarea name="description" style="resize: none" style="height: 100px" maxlength="2000"
                      formControlName="description" class="form-control form-control-alternative"
                      placeholder="{{ 'DESCRIPTION' | translate }}"></textarea>
                  </div>
                </div>

                <div class="form-group row clearfix">
                  <div class="col-md-2">
                    <label for="inputFirstName" class="control-label">
                      {{ "ATTRIBUTE_LOGO" | translate }}
                    </label>
                  </div>
                  <div class="col-sm-4">
                    <div class="userpic">
                      <div class="userpic-wrapper bg-666666">
                        <img [src]="itemAttributeForm.value.item_attribute_logo" (change)="onFileChange($event)"
                          (click)="triggerSelectFile(fileInput)" />
                      </div>

                      <i class="fa fa-times-circle-o" (click)="removeImage()"></i>

                      <a class="change-userpic" (change)="onFileChange($event)"
                        (click)="triggerSelectFile(fileInput)">{{ "CHANGE_ATTRIBUTE_IMAGE" | translate }}
                      </a>

                      <input type="file" class="cursor-pointer" #fileInput (click)="fileInput.click()" [hidden]="true"
                        (change)="onFileChange($event)" />
                    </div>
                  </div>
                </div>

                <div class="form-group row clearfix">
                  <div class="col-md-2">
                    <label for="inputFirstName" class="control-label">{{ "APPLICABLE_SUB_CATEGORY" | translate }}
                    </label>
                  </div>
                  <div class="col-md-9">
                    <button type="button" class="btn btn-primary btn-with-icon save-profile"
                      (click)="openSelectSubCat()">
                      <svg id="Layer_1" data-name="Layer 1" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
                        <path class="" d="M50,37.36A13.64,13.64,0,1,0,63.64,51,13.66,13.66,0,0,0,50,37.36Z" />
                        <path class=""
                          d="M50,16.91A53.76,53.76,0,0,0,0,51a53.71,53.71,0,0,0,100,0A53.74,53.74,0,0,0,50,16.91Zm0,56.82A22.73,22.73,0,1,1,72.73,51,22.75,22.75,0,0,1,50,73.73Z" />
                      </svg>
                      &nbsp;{{ "SELECT_SUB_CATEGORY" | translate }}
                    </button>
                    <label for="" class="control-label" style="padding-left: 10px">
                      {{ "SELECTED" | translate }} :
                      {{ received_modal_data.length }}
                    </label>
                  </div>
                </div>

                <div class="form-group row clearfix">
                  <div class="col-md-2">
                    <label for="inputFirstName" class="control-label">{{
                      "SUB_ATTRIBUTE_NAME" | translate
                      }}</label>
                  </div>
                  <div class="col-md-9">
                    <label class="radio-inline custom-radio nowrap">
                      <input type="radio"  class="cursor-pointer" value="1" name="subAttrubuteType" formControlName="sub_item_attribute_type" />
                      <span class="a-label">{{ "VALUE" | translate }}</span>
                    </label>

                    <label class="radio-inline custom-radio nowrap">
                      <input type="radio"  class="cursor-pointer" value="2" name="subAttrubuteType" formControlName="sub_item_attribute_type" />
                      <span class="a-label">{{ "COLOR" | translate }}</span>
                    </label>
                  </div>
                </div>

                <div *ngIf="itemAttributeForm.value.sub_item_attribute_type == '1'">
                  <div class="form-group row clearfix">
                    <div class="col-md-2"></div>
                    <div class="col-sm-4 d-flex">
                      <input type="text" name="sub_item_attribute_name" formControlName="sub_item_attribute_name"
                        class="form-control form-control-alternative" placeholder="{{ 'VALUE' | translate }}" />

                      &nbsp;&nbsp;
                      <button [disabled]="
                          itemAttributeForm.value.sub_item_attribute_name ==
                            '' ||
                          itemAttributeForm.value.sub_item_attribute_name ==
                            undefined
                            ? true
                            : false
                        " type="button" class="btn btn-primary save-profile" (click)="addSubItemAttributeName()">
                        <i class="fa fa-plus-circle"></i>
                      </button>
                    </div>
                  </div>

                  <div class="form-group row clearfix">
                    <div class="col-md-2"></div>
                    <div class="col-md-6">
                      <table class="table table-bordered table-striped">
                        <thead>
                          <tr>
                            <th>{{ "VALUE" | translate }}</th>
                            <th class="text-center">
                              {{ "ACTION" | translate }}
                            </th>
                          </tr>
                        </thead>
                        <tbody *ngIf="subItemAttributesListArray.length > 0">
                          <tr class="gradeX" *ngFor="let item of subItemAttributesListArray">
                            <td>
                              <span>
                                <span>{{ item.sub_item_attribute_name }}</span>
                              </span>
                            </td>
                            <td class="text-center">
                              <span style="margin-right: 10%" (click)="editValue(item)">
                                <a href="javascript:void(0)">
                                  <i class="fa fa-edit" aria-hidden="true"
                                    style="color: #24c9fc; font-size:20px"></i></a>
                              </span>
                              <span>
                                <a (click)="removeValue(item)">
                                  <i class="fa fa-minus-circle" aria-hidden="true"
                                    style="color: #ea5353e8; font-size:20px"></i></a>
                              </span>
                            </td>
                          </tr>
                        </tbody>
                        <tbody *ngIf="subItemAttributesListArray.length <= 0">
                          <tr>
                            <td colspan="5">
                              <span class="text-center d-block">{{ "NO_RECORD_FOUNDS" | translate
                                }}</span>
                            </td>
                          </tr>
                        </tbody>
                      </table>
                    </div>
                  </div>
                </div>

                <div class="form-group row clearfix">
                  <div class="col-md-2">
                    <label for="inputFirstName" class="control-label">{{
                      "USE_IN_FILTER_OPTION" | translate
                      }}</label>
                  </div>
                  <div class="col-sm-4">
                    <input type="checkbox" class="cursor-pointer" formControlName="is_use_in_filter" />
                  </div>
                </div>

                <div class="form-group row clearfix">
                  <div class="col-md-2">
                    <label for="inputFirstName" class="control-label">{{
                      "ACTIVE" | translate
                      }}</label>
                  </div>
                  <div class="col-sm-4">
                    <input type="checkbox" class="cursor-pointer" formControlName="is_active" />
                  </div>
                </div>
              </div>
            </div>
            <!-- buttons -->
            <div class="col-md-12">
              <div class="form-group row clearfix">
                <div class="col-md-2"></div>
                <div>
                  <button class="btn btn-white cancelbtn" type="button" (mousedown)="cancelClick()">
                    <img class="btn-icon-width" src="assets/icons/button/reject.svg" />&nbsp;Cancel
                  </button>
                  <button type="submit" class="btn btn-primary btn-with-icon save-profile globleSVGColorButtonChnage">
                    <svg class="btn-icon-width" id="Layer_1" data-name="Layer 1" xmlns="http://www.w3.org/2000/svg"
                      viewBox="0 0 100 100">
                      <defs>
                        <style>
                          .cls-1 {
                            fill: #fff;
                          }
                        </style>
                      </defs>
                      <path class="cls-1"
                        d="M77.78,0H11.11A11.1,11.1,0,0,0,0,11.11V88.89A11.1,11.1,0,0,0,11.11,100H88.89A11.1,11.1,0,0,0,100,88.89V22.22ZM50,88.89A16.67,16.67,0,1,1,66.67,72.22,16.68,16.68,0,0,1,50,88.89ZM66.67,33.33H11.11V11.11H66.67Z" />
                    </svg>
                    &nbsp;{{ "SAVE" | translate }}
                  </button>
                </div>
              </div>
            </div>
            <!-- buttons -->
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
