<div class="header bg-gradient-danger pt-0 pt-md-0 header-bg-gradient-space">
  <div class="container-fluid">
    <div class="header-body"></div>
  </div>
</div>
<!-- Page content -->
<div class="container-fluid container-body-space">
  <!-- Table -->
  <div class="row">
    <div class="col-12">
      <div class="card shadow">
        <div class="card-header border-0 d-flex flex-wrap justify-content-between align-items-center">
          <h3 class="panel-title mb-0">
            <span class="head-img"><img src="assets/icons/add_addons1.svg" /></span>
            <span class="align-text-top" *ngIf="addonId == 0">{{ "CREATE_ADDON" | translate }}</span>
            <span class="align-text-top" *ngIf="addonId != 0">{{ "EDIT_ADDON" | translate }}</span>
          </h3>
          <a class="globleSVGColorButtonChnageReply back-btn" (mousedown)="cancelClick()">
            <svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" id="Capa_1"
              x="0px" y="0px" width="55px" height="45px" viewBox="0 0 612 612"
              style="enable-background: new 0 0 612 612" xml:space="preserve">
              <g>
                <g>
                  <g id="reply-all">
                    <path
                      d="M178.5,191.25v-76.5L0,293.25l178.5,178.5v-76.5l-102-102L178.5,191.25z M331.5,216.75v-102L153,293.25l178.5,178.5V367.2    C459,367.2,548.25,408,612,497.25C586.5,369.75,510,242.25,331.5,216.75z"
                      data-original="#000000" class="active-path" data-old_color="#24c9fc" fill="#24c9fc" />
                  </g>
                </g>
              </g>
            </svg>
          </a>
        </div>
        <form [formGroup]="formGroup" (ngSubmit)="onSubmit()">
          <div class="col-md-12">
            <br />
            <div class="form-group row clearfix">
              <div class="col-md-2">
                <label for="addonName" class="control-label">{{ "ADDON_NAME" | translate
                  }}<span class="required">*</span></label>
              </div>
              <div class="col-sm-4">
                <input type="text" #cursor name="addon_name" formControlName="addon_name"
                  class="form-control form-control-alternative" placeholder="{{ 'ADDON_NAME' | translate }}" />
                <div class="errormessage" *ngIf="controlHasError('required', 'addon_name')">
                  {{ "PLEASE_ENTER_ADDON_NAME" | translate }}
                </div>
              </div>
            </div>
          </div>

          <div class="col-md-12">
            <div class="form-group row clearfix">
              <div class="col-md-2">
                <label for="description" class="control-label">{{
                  "ADDON_DESCRIPTION" | translate
                  }}</label>
              </div>
              <div class="col-sm-4">
                <textarea type="text" name="description" formControlName="description"
                  placeholder="{{ 'ADDON_DESCRIPTION' | translate }}" class="form-control form-control-alternative"
                  maxlength="2000">
                </textarea>
              </div>
            </div>
          </div>

          <div class="col-md-12">
            <div class="form-group row clearfix">
              <div class="col-md-2">
                <label for="inputFirstName" class="control-label">{{
                  "SUB_ADDON_NAME" | translate
                  }}</label>
              </div>
              <div class="col-sm-4 d-flex">
                <input type="text" name="sub_addon_name" formControlName="sub_addon_name"
                  class="form-control form-control-alternative" placeholder="{{ 'SUB_ADDON_NAME' | translate }}" />
                &nbsp;&nbsp;
                <button [disabled]="
                    formGroup.value.sub_addon_name == '' ||
                    formGroup.value.sub_addon_name == undefined
                      ? true
                      : false
                  " type="button" (click)="addsubname()" class="btn btn-primary save-profile">
                  <i class="fa fa-plus-circle"></i>
                </button>
                <input type="hidden" name="sub_category_id" id="sub_category_id" formControlName="sub_category_id"
                  placeholder="sub_category_id" />
                <input type="hidden" name="addon_price_id" id="addon_price_id" formControlName="addon_price_id"
                  placeholder="addon price id" />
              </div>
            </div>
            <div class="form-group row clearfix">
              <div class="col-md-2"></div>
              <div class="col-md-6">
                <table class="table table-bordered table-striped">
                  <thead>
                    <tr>
                      <th>{{ "SUB_ADDON_NAME" | translate }}</th>
                      <th class="text-center">{{ "ACTION" | translate }}</th>
                    </tr>
                  </thead>
                  <tbody>
                    <tr class="gradeX" *ngFor="let item of subnameItem">
                      <td>
                        <span>
                          <span>{{ item.sub_addon_name }}</span>
                        </span>
                      </td>
                      <td class="text-center">
                        <span style="margin-right: 10%" (click)="editSubname(item)">
                          <a href="javascript:void(0)">
                            <i class="fa fa-edit" aria-hidden="true" style="color: #24c9fc; font-size:20px;"></i></a>
                        </span>
                        <span>
                          <a [ngClass]="{ disableddiv: item.is_used == true }" (click)="removeSubname(item)">
                            <i class="fa fa-minus-circle cursor-pointer" aria-hidden="true"
                              style="color: #ea5353e8; font-size:20px;"></i></a>
                        </span>
                      </td>
                    </tr>
                  </tbody>
                </table>
              </div>
            </div>
          </div>

          <div class="col-md-12">
            <div class="form-group row clearfix">
              <div class="col-md-2"></div>
              <div class="col-md-4">
                <button class="btn btn-white cancelbtn" type="button" (mousedown)="cancelClick()">
                  <img class="btn-icon-width" src="assets/icons/button/reject.svg" />&nbsp;{{ "CANCLE" | translate }}
                </button>

                <button type="submit" class="btn btn-primary btn-with-icon save-profile globleSVGColorButtonChnage">
                  <svg class="btn-icon-width" id="Layer_1" data-name="Layer 1" xmlns="http://www.w3.org/2000/svg"
                    viewBox="0 0 100 100">
                    <defs>
                      <style>
                        .cls-1 {
                          fill: #fff;
                        }
                      </style>
                    </defs>
                    <path class="cls-1"
                      d="M77.78,0H11.11A11.1,11.1,0,0,0,0,11.11V88.89A11.1,11.1,0,0,0,11.11,100H88.89A11.1,11.1,0,0,0,100,88.89V22.22ZM50,88.89A16.67,16.67,0,1,1,66.67,72.22,16.68,16.68,0,0,1,50,88.89ZM66.67,33.33H11.11V11.11H66.67Z" />
                  </svg>&nbsp;{{ "SAVE" | translate }}
                </button>
              </div>
            </div>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
