<div class="header bg-gradient-danger pt-0 pt-md-0 header-bg-gradient-space">
  <div class="container-fluid">
    <div class="header-body"></div>
  </div>
</div>
<!-- Page content -->
<div class="container-fluid container-body-space">
  <!-- Table -->
  <div class="row">
    <div class="col-12">
      <div class="card shadow">
        <div class="card-header border-0 d-flex flex-wrap justify-content-between align-items-center">
          <h3 class="panel-title mb-0">
            <span class="head-img"><svg id="Layer_1" data-name="Layer 1" xmlns="http://www.w3.org/2000/svg"
                viewBox="0 0 25 25">
                <path
                  d="M22.14,0H2.86A2.86,2.86,0,0,0,0,2.86V13.8a2.87,2.87,0,0,0,2.86,2.87h8.37A7.8,7.8,0,0,1,25,14.08V2.86A2.86,2.86,0,0,0,22.14,0ZM6.51,4.69H3.91a.79.79,0,1,1,0-1.57h2.6a.79.79,0,0,1,0,1.57Zm6,6.77a3.13,3.13,0,1,1,3.12-3.13A3.13,3.13,0,0,1,12.5,11.46Z" />
                <path
                  d="M18.75,12.5A6.25,6.25,0,1,0,25,18.75,6.25,6.25,0,0,0,18.75,12.5Zm2.86,7.29H19.79v1.82a1,1,0,1,1-2.08,0V19.79H15.89a1,1,0,1,1,0-2.08h1.82V15.89a1,1,0,1,1,2.08,0v1.82h1.82a1,1,0,1,1,0,2.08Z" />
              </svg>
            </span>
            <span class="align-text-top" *ngIf="!payment_method_id">{{ "ADD_PAYMENT_METHOD" | translate }}</span>
            <span class="align-text-top" *ngIf="payment_method_id">{{"EDIT_PAYMENT_METHOD" | translate}}</span>
          </h3>
          <a class="globleSVGColorButtonChnageReply back-btn" (mousedown)="cancelClick()">
            <svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" id="Capa_1"
              x="0px" y="0px" width="55px" height="45px" viewBox="0 0 612 612"
              style="enable-background: new 0 0 612 612" xml:space="preserve">
              <g>
                <g>
                  <g id="reply-all">
                    <path
                      d="M178.5,191.25v-76.5L0,293.25l178.5,178.5v-76.5l-102-102L178.5,191.25z M331.5,216.75v-102L153,293.25l178.5,178.5V367.2    C459,367.2,548.25,408,612,497.25C586.5,369.75,510,242.25,331.5,216.75z"
                      data-original="#000000" class="active-path" data-old_color="#24c9fc" fill="#24c9fc" />
                  </g>
                </g>
              </g>
            </svg>
          </a>
        </div>
        <form class="form" [formGroup]="formGroup" (submit)="onSubmit()">
          <div class="m-20px">
            <div class="row">
              <div class="col-md-12">
                <br />
                <!-- name -->
                <div class="form-group row clearfix">
                  <div class="col-md-4">
                    <label for="name" class="control-label">{{ "PAYMENT_METHOD_NAME" | translate
                      }}<span class="required">*</span></label>
                  </div>

                  <div class="col-sm-6">
                    <input type="text" #cursor name="name" formControlName="name"
                      class="form-control form-control-alternative"
                      placeholder="{{ 'PAYMENT_METHOD_NAME' | translate }}" />
                    <div class="errormessage" *ngIf="controlHasError('required', 'name')">
                      {{ "PLEASE_ENTER_PAYMENT_METHOD_NAME" | translate }}
                    </div>
                  </div>
                </div>
                <!-- name -->

                <!-- method_name -->
                <div class="form-group row clearfix">
                  <div class="col-md-4">
                    <label for="displayName" class="control-label">{{ "PAYMENT_METHOD_NAME_CUSTOMER_DISPLAY" | translate
                      }}
                      <span class="required">*</span></label>
                  </div>
                  <div class="col-sm-6">
                    <input type="text" [ngClass]="
                        controlHasError('required', 'displayName')
                          ? 'error form-control'
                          : 'form-control'
                      " placeholder="{{
                        'PAYMENT_METHOD_NAME_CUSTOMER_DISPLAY' | translate
                      }}" maxlength="500" formControlName="displayName" />
                    <div class="errormessage" *ngIf="controlHasError('required', 'displayName')">
                      <div ng-message="required">
                        {{
                        "PLEASE_ENTER_PAYMENT_METHOD_NAME_CUSTOMER_DISPLAY"
                        | translate
                        }}
                      </div>
                    </div>
                  </div>
                </div>
                <!-- method_name -->

                <!-- posMethodName -->
                <div class="form-group row clearfix" *ngIf="!hideFields == true">
                  <div class="col-md-4">
                    <label for="posMethodName" class="control-label">{{
                      "PAYMENT_METHOD_NAME_POS_DINEIN_DISPLAY" | translate
                      }}
                      <span class="required">*</span></label>
                  </div>
                  <div class="col-sm-6">
                    <input type="text" [ngClass]="
                        controlHasError('required', 'posMethodName')
                          ? 'error form-control'
                          : 'form-control'
                      " placeholder="{{
                        'PAYMENT_METHOD_NAME_POS_DINEIN_DISPLAY' | translate
                      }}" maxlength="500" formControlName="posMethodName" />
                    <div class="errormessage" *ngIf="controlHasError('required', 'posMethodName')">
                      <div ng-message="required">
                        {{
                        "PLEASE_ENTER_PAYMENT_METHOD_NAME_POS_DINEIN_DISPLAY" | translate
                        }}
                      </div>
                    </div>
                  </div>
                </div>
                <!-- posMethodName -->

                <!-- methodType -->
                <div class="form-group row clearfix">
                  <div class="col-md-4">
                    <label for="methodType" class="control-label">{{ "TYPE_OF_PAYMENT_METHOD" | translate
                      }}</label>
                  </div>
                  <div class="col-sm-6">
                    <input type="text" disabled Class="form-control"
                      placeholder="{{ 'TYPE_OF_PAYMENT_METHOD' | translate }}" maxlength="500"
                      formControlName="methodType" />
                  </div>
                </div>
                <!-- methodType -->

                <!-- multipaymentAllowed -->
                <div class="form-group row clearfix" *ngIf="this.dinein_module != 0 && this.pos_module != 0">
                  <div class="col-md-4">
                    <label for="multipaymentAllowed" class="control-label">{{"MULTIPLE_ALLOWED_IN_SINGLE_ORDER" |
                      translate}}</label>
                  </div>
                  <div class="col-sm-6">
                    <input type="checkbox" class="cursor-pointer" name="multipaymentAllowed" formControlName="multipaymentAllowed" />
                  </div>
                </div>

                <!-- isActive -->
                <div class="form-group row clearfix">
                  <div class="col-md-4">
                    <label for="isActive" class="control-label">{{
                      "ACTIVE" | translate
                      }}</label>
                  </div>
                  <div class="col-sm-6">
                    <input type="checkbox" class="cursor-pointer" name="isActive" formControlName="isActive" />
                  </div>
                </div>
                <!-- isActive -->
              </div>

              <!-- buttons -->
              <div class="col-md-12">
                <div class="form-group row clearfix">
                  <div class="col-md-4"></div>

                  <div class="col-md-4">
                    <button class="btn btn-white cancelbtn" type="button" (mousedown)="cancelClick()">
                      <img class="btn-icon-width" src="assets/icons/button/reject.svg" />&nbsp;{{ "CANCEL" | translate
                      }}
                    </button>
                    <button type="submit" class="btn btn-primary btn-with-icon save-profile globleSVGColorButtonChnage">
                      <svg class="btn-icon-width" id="Layer_1" data-name="Layer 1" xmlns="http://www.w3.org/2000/svg"
                        viewBox="0 0 100 100">
                        <defs>
                          <style>
                            .cls-1 {
                              fill: #fff;
                            }
                          </style>
                        </defs>
                        <path class="cls-1"
                          d="M77.78,0H11.11A11.1,11.1,0,0,0,0,11.11V88.89A11.1,11.1,0,0,0,11.11,100H88.89A11.1,11.1,0,0,0,100,88.89V22.22ZM50,88.89A16.67,16.67,0,1,1,66.67,72.22,16.68,16.68,0,0,1,50,88.89ZM66.67,33.33H11.11V11.11H66.67Z" />
                      </svg>
                      &nbsp; {{ "SAVE" | translate }}
                    </button>
                  </div>
                </div>
              </div>
              <!-- buttons -->
            </div>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
