<div class="header bg-gradient-danger pt-0 pt-md-0 header-bg-gradient-space">
  <div class="container-fluid">
    <div class="header-body"></div>
  </div>
</div>

<!-- Page content -->
<div class="container-fluid container-body-space">
  <!-- Table -->
  <div class="row">
    <div class="col-12">
      <div class="card shadow">
        <div class="card-header border-0 d-flex flex-wrap justify-content-between align-items-center">
          <h3 class="panel-title mb-0">
            <span class="head-img"><img src="assets/icons/add_reason.svg" /></span>
            <span class="align-text-top" *ngIf="!reason_id">{{ "ADD_REASON" | translate }}</span>
            <span class="align-text-top" *ngIf="reason_id">{{ "EDIT_REASON" | translate }}</span>
          </h3>
          <a class="globleSVGColorButtonChnageReply back-btn" (mousedown)="cancelClick()">
            <svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" id="Capa_1"
              x="0px" y="0px" width="55px" height="45px" viewBox="0 0 612 612"
              style="enable-background: new 0 0 612 612" xml:space="preserve">
              <g>
                <g>
                  <g id="reply-all">
                    <path
                      d="M178.5,191.25v-76.5L0,293.25l178.5,178.5v-76.5l-102-102L178.5,191.25z M331.5,216.75v-102L153,293.25l178.5,178.5V367.2    C459,367.2,548.25,408,612,497.25C586.5,369.75,510,242.25,331.5,216.75z"
                      data-original="#000000" class="active-path" data-old_color="#24c9fc" fill="#24c9fc" />
                  </g>
                </g>
              </g>
            </svg>
          </a>
        </div>

        <form [formGroup]="formGroup" (ngSubmit)="onSubmit()">
          <div class="col-md-12">
            <br />
            <div class="form-group row clearfix">
              <div class="col-md-2">
                <label for="inputFirstName" class="control-label">{{ "REASON" | translate
                  }}<span class="required">*</span></label>
              </div>
              <div class="col-sm-4">
                <input type="text" #cursor required name="reason" formControlName="reason"
                  class="form-control form-control-alternative" placeholder="{{ 'REASON' | translate }}" />
                <div class="errormessage" *ngIf="controlHasError('required', 'reason')">
                  {{ "PLEASE_ENTER_REASON" | translate }}
                </div>
              </div>
            </div>

            <div class="form-group row clearfix">
              <div class="col-md-2">
                <label for="inputFirstName" class="control-label">{{ "REASON_TYPE" | translate
                  }}<span class="required">*</span></label>
              </div>
              <div class="col-sm-4">
                <div class="form-group">
                  <div>
                    <ng-select [clearable]="false" formControlName="reason_type"
                      placeholder="{{ 'SELECT_REASON_TYPE' | translate }}" (change)="reasonTypeChange()">
                      <ng-option *ngFor="let item of orderStatusList" [value]="item.value">
                        {{ item.label }}
                      </ng-option>
                    </ng-select>
                    <div class="errormessage" *ngIf="controlHasError('required', 'reason_type')">
                      {{ "PLEASE_SELECT_REASON_TYPE" | translate }}
                    </div>
                  </div>
                </div>
              </div>
            </div>

            <div class="form-group row clearfix" [hidden]="
                formGroup.value.reason_type == 6 ||
                formGroup.value.reason_type == 9 ||
                formGroup.value.reason_type == 8 ||
                formGroup.value.reason_type == undefined
              ">
              <div class="col-md-2">
                <label for="inputFirstName" class="control-label">{{ "ORDER_TYPE" | translate
                  }}<span class="required">*</span></label>
              </div>
              <div class="col-sm-4">
                <div class="form-group">
                  <div>
                    <ng-select [searchable]="true" [clearable]="false" [multiple]="true" formControlName="order_type"
                      placeholder="{{ 'ORDER_TYPE' | translate }}" name="order_type" (change)="orderTypeChange()">
                      <ng-option *ngFor="let item of ordertypeList" [value]="item.value">{{ item.name }}</ng-option>
                    </ng-select>
                  </div>
                </div>
              </div>
              <div class="col-sm-4" style="padding-top: 7px">
                <input type="checkbox" class="cursor-pointer" (change)="orderTypeChanged()" formControlName="allSelected" />
                All&nbsp;
              </div>
            </div>

            <div class="form-group row clearfix" *ngIf="formGroup.get('reason_type').value != null">
              <div class="col-md-2">
                <label for="inputFirstName" class="control-label">{{ "Role" | translate
                  }}<span class="required">*</span></label>
              </div>
              <div class="col-sm-4">
                <span *ngIf="formGroup.get('reason_type').value != '1'">
                  <input type="checkbox" class="cursor-pointer" formControlName="store" (change)="RoleChange()" />
                  {{ store_label }} &nbsp;
                </span>

                <span *ngIf="formGroup.get('reason_type').value == '2' || formGroup.get('reason_type').value == '3'
                  || formGroup.get('reason_type').value == '4' || formGroup.get('reason_type').value == '5'
                  ||formGroup.get('reason_type').value == '7'">
                  <input type="checkbox" class="cursor-pointer" formControlName="delivery" (change)="RoleChange()" />
                  {{ deliveryboy_label }} &nbsp;
                </span>

                <span *ngIf="formGroup.get('reason_type').value == 1">
                  <input type="checkbox" class="cursor-pointer" formControlName="customer" (change)="RoleChange()" />
                  {{ "CUSTOMER" | translate }} &nbsp;
                </span>
              </div>
            </div>

            <div class="form-group row clearfix">
              <div class="col-md-2">
                <label class="control-label">{{ "ACTIVE" | translate }}</label>
              </div>
              <div class="col-sm-4">
                <input type="checkbox" class="cursor-pointer" formControlName="is_active" />
              </div>
            </div>
          </div>

          <div class="col-md-12">
            <div class="form-group row clearfix">
              <div class="col-md-2"></div>
              <div class="col-md-4">
                <button class="btn btn-white cancelbtn" type="button" (mousedown)="cancelClick()">
                  <img class="btn-icon-width" src="assets/icons/button/reject.svg" />&nbsp;Cancel
                </button>
                <button type="submit" class="btn btn-primary btn-with-icon save-profile globleSVGColorButtonChnage">
                  <svg class="btn-icon-width" id="Layer_1" data-name="Layer 1" xmlns="http://www.w3.org/2000/svg"
                    viewBox="0 0 100 100">
                    <defs>
                      <style>
                        .cls-1 {
                          fill: #fff;
                        }
                      </style>
                    </defs>
                    <path class="cls-1"
                      d="M77.78,0H11.11A11.1,11.1,0,0,0,0,11.11V88.89A11.1,11.1,0,0,0,11.11,100H88.89A11.1,11.1,0,0,0,100,88.89V22.22ZM50,88.89A16.67,16.67,0,1,1,66.67,72.22,16.68,16.68,0,0,1,50,88.89ZM66.67,33.33H11.11V11.11H66.67Z" />
                  </svg>&nbsp;{{ "SAVE" | translate }}
                </button>
              </div>
            </div>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
