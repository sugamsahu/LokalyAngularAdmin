<div class="header bg-gradient-danger pt-0 pt-md-0 header-bg-gradient-space">
  <div class="container-fluid">
    <div class="header-body"></div>
  </div>
</div>

<div class="container-fluid container-body-space">
  <!-- Table -->
  <div class="row">
    <div class="col-12">
      <div class="card shadow">
        <div class="card-header border-0 d-flex flex-wrap justify-content-between align-items-center">
          <h3 class="panel-title mb-0">
            <span class="head-img"><img src="assets/icons/item_tag_add.svg" /></span>
            <span class="align-text-top" *ngIf="!item_tag_id">{{ "CREATE_ITEM_TAG" | translate }}</span>
            <span class="align-text-top" *ngIf="item_tag_id">{{ "EDIT_ITEM_TAG" | translate }}</span>
          </h3>
          <a class="globleSVGColorButtonChnageReply back-btn" (mousedown)="cancelClick()">
            <svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" id="Capa_1"
              x="0px" y="0px" width="55px" height="45px" viewBox="0 0 612 612"
              style="enable-background: new 0 0 612 612" xml:space="preserve">
              <g>
                <g>
                  <g id="reply-all">
                    <path
                      d="M178.5,191.25v-76.5L0,293.25l178.5,178.5v-76.5l-102-102L178.5,191.25z M331.5,216.75v-102L153,293.25l178.5,178.5V367.2    C459,367.2,548.25,408,612,497.25C586.5,369.75,510,242.25,331.5,216.75z"
                      data-original="#000000" class="active-path" data-old_color="#24c9fc" fill="#24c9fc" />
                  </g>
                </g>
              </g>
            </svg>
          </a>
        </div>
        <form class="form" [formGroup]="itemTagForm" (submit)="onSubmit()">
          <div class="m-20px">
            <div class="row">
              <div class="col-md-12">
                <br />
                <!-- name -->
                <div class="form-group row clearfix">
                  <div class="col-md-2">
                    <label for="name" class="control-label">{{ "ITEM_TAG" | translate
                      }}<span class="required">*</span></label>
                  </div>

                  <div class="col-sm-4">
                    <input type="text" #cursor name="name" formControlName="item_tag_name"
                      class="form-control form-control-alternative" placeholder="{{ 'ITEM_TAG' | translate }}" />
                    <div class="errormessage" *ngIf="controlHasError('required', 'item_tag_name')">
                      {{ "ENTER_TAG_NAME" | translate }}
                    </div>
                  </div>
                </div>

                <div class="form-group row clearfix">
                  <div class="col-md-2">
                    <label for="name" class="control-label">{{
                      "DESCRIPTION" | translate
                      }}</label>
                  </div>
                  <div class="col-sm-4">
                    <textarea name="item_tag_description" style="height: 100px" maxlength="2000"
                      formControlName="item_tag_description" class="form-control form-control-alternative"
                      placeholder="{{ 'DESCRIPTION' | translate }}"></textarea>
                  </div>
                </div>

                <div class="form-group row clearfix">
                  <div class="col-md-2">
                    <label for="storeCategory" class="control-label">{{ "STORE_TYPE" | translate }}
                      <span class="required">*</span></label>
                  </div>
                  <div class="col-sm-4">
                    <ng-select [searchable]="true" [multiple]="true" [clearable]="true" formControlName="store_types"
                      name="store_type" placeholder="{{
                        'MULTIPLE_SELECT_STORE_TYPE' | translate
                      }}">
                      <ng-option *ngFor="let item of store_type_list" [value]="item.category_id">
                        {{ item.category_name }}
                      </ng-option>
                    </ng-select>
                    <div class="errormessage" *ngIf="controlHasError('required', 'store_types')">
                      {{ "PLEASE_SELECT_STORETYPE" | translate }}
                    </div>
                  </div>

                  <div class="col-md-4">
                    <span *ngIf="is_display_is_eatery == 1">
                      <input type="checkbox" class="cursor-pointer" class="cursor-pointer" formControlName="all_eatery" (change)="
                        stateChanged(itemTagForm.value.all_eatery, 'all_eatery')
                      " />&nbsp;
                      <span>All Eatery &nbsp;</span>
                    </span>

                    <input type="checkbox" class="cursor-pointer" class="cursor-pointer" formControlName="all_wholesale" (change)="
                        stateChanged(
                          itemTagForm.value.all_wholesale,
                          'all_wholesale'
                        )
                      " *ngIf="is_allow_whole_seller == 1" />
                    <span *ngIf="is_allow_whole_seller == 1">
                      All Wholesale &nbsp;</span>

                    <input type="checkbox" class="cursor-pointer" class="cursor-pointer" formControlName="all_store" (change)="
                        stateChanged(itemTagForm.value.all_store, 'all_store')
                      " />
                    <span> All {{ "STORE" | translate }}&nbsp;</span>
                  </div>
                </div>

                <div class="form-group row clearfix">
                  <div class="col-md-2">
                    <label for="inputFirstName" class="control-label">{{
                      "TAG_LOGO" | translate
                      }}</label>
                  </div>
                  <div class="col-sm-4">
                    <div class="userpic">
                      <div class="userpic-wrapper bg-666666">
                        <img *ngIf="!is_cropped_image" [src]="itemTagForm.value.item_tag_image" (click)="openUpdateTagImageModal()"/>
                          <img *ngIf="is_cropped_image" [src]="cropped_store_logo" (click)="openUpdateTagImageModal()"/>
                      </div>

                      <i class="fa fa-times-circle-o" (click)="removeImage()"></i>

                      <a class="change-userpic" (click)="openUpdateTagImageModal()">{{ "CHANGE_TAG_IMAGE" | translate }}
                      </a>

                      <input type="file" class="cursor-pointer" id="cuisineImageFile" #fileInput (click)="fileInput.click()" [hidden]="true"
                        (change)="onFileChange($event)" />
                    </div>
                  </div>
                </div>
              </div>
            </div>
            <!-- buttons -->
            <div class="col-md-12">
              <div class="form-group row clearfix">
                <div class="col-md-2"></div>
                <div class="col-sm-4" style="margin-left: -11px !important;">
                  <button class="btn btn-white cancelbtn" type="button" (mousedown)="cancelClick()">
                    <img class="btn-icon-width" src="assets/icons/button/reject.svg" />&nbsp;{{ "CANCEL" | translate }}
                  </button>
                  <button type="submit" class="btn btn-primary btn-with-icon save-profile globleSVGColorButtonChnage">
                    <svg class="btn-icon-width" id="Layer_1" data-name="Layer 1" xmlns="http://www.w3.org/2000/svg"
                      viewBox="0 0 100 100">
                      <defs>
                        <style>
                          .cls-1 {
                            fill: #fff;
                          }
                        </style>
                      </defs>
                      <path class="cls-1"
                        d="M77.78,0H11.11A11.1,11.1,0,0,0,0,11.11V88.89A11.1,11.1,0,0,0,11.11,100H88.89A11.1,11.1,0,0,0,100,88.89V22.22ZM50,88.89A16.67,16.67,0,1,1,66.67,72.22,16.68,16.68,0,0,1,50,88.89ZM66.67,33.33H11.11V11.11H66.67Z" />
                    </svg>
                    &nbsp;{{ "SAVE" | translate }}
                  </button>
                </div>
              </div>
            </div>
            <!-- buttons -->
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
