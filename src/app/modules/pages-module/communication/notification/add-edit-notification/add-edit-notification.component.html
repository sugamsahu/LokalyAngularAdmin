<div class="header bg-gradient-danger pt-0 pt-md-0 header-bg-gradient-space">
  <div class="container-fluid">
    <div class="header-body"></div>
  </div>
</div>
<!-- Page content -->
<div class="container-fluid container-body-space">
  <!-- Table -->
  <div class="row">
    <div class="col-12">
      <div class="card shadow">
        <div class="card-header border-0 d-flex flex-wrap justify-content-between align-items-center">
          <h3 class="panel-title mb-0">
            <span class="head-img"><img src="assets/icons/notification.svg" /></span>
            <span class="align-text-top">{{ "NOTIFICATION_TEMPLATE" | translate }}</span>
          </h3>
          <a class="globleSVGColorButtonChnageReply back-btn" (mousedown)="cancelClick()">
            <svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" id="Capa_1"
              x="0px" y="0px" width="55px" height="45px" viewBox="0 0 612 612"
              style="enable-background: new 0 0 612 612" xml:space="preserve">
              <g>
                <g>
                  <g id="reply-all">
                    <path
                      d="M178.5,191.25v-76.5L0,293.25l178.5,178.5v-76.5l-102-102L178.5,191.25z M331.5,216.75v-102L153,293.25l178.5,178.5V367.2    C459,367.2,548.25,408,612,497.25C586.5,369.75,510,242.25,331.5,216.75z"
                      data-original="#000000" class="active-path" data-old_color="#24c9fc" fill="#24c9fc" />
                  </g>
                </g>
              </g>
            </svg>
          </a>
        </div>
        <form [formGroup]="formGroup" (ngSubmit)="confirmLoginPassword()">
          <div class="col-md-12">
            <br />
            <div class="form-group row clearfix">
              <div class="col-md-2">
                <label for="name" class="control-label">{{ "Name" | translate
                  }}<span class="required">*</span></label>
              </div>
              <div class="col-sm-4">
                <input type="text" required name="name" formControlName="name" placeholder="{{ 'Name' | translate }}"
                  class="form-control form-control-alternative" />
                <div class="errormessage" *ngIf="controlHasError('required', 'name')">
                  {{ "PLEASE_ENTER_NAME" | translate }}
                </div>
              </div>
            </div>
          </div>

          <!-- title -->
          <div class="col-md-12">
            <div class="form-group row clearfix">
              <div class="col-md-2">
                <label for="notification_title" class="control-label">{{ "TITLE" | translate
                  }}<span class="required">*</span></label>
              </div>
              <div class="col-sm-4">
                <input type="text" name="notification_title" formControlName="notification_title" maxlength="50"
                  placeholder="{{ 'TITLE' | translate }}" class="form-control form-control-alternative" />
                <div class="errormessage" *ngIf="controlHasError('required', 'notification_title')">
                  {{ "PLEASE_ENTER_TITLE" | translate }}
                </div>
              </div>
            </div>
          </div>

          <div class="col-md-12">
            <div class="form-group row clearfix">
              <div class="col-md-2">
                <label for="notification_text" class="control-label">{{
                  "NOTIFICATION_TEXT" | translate
                  }}<span class="required">*</span></label>
              </div>
              <div class="col-sm-4">
                <textarea required style="width: 600px" type="text" name="notification_text"
                  placeholder="{{ 'NOTIFICATION_TEXT' | translate }}" formControlName="notification_text"
                  class="form-control form-control-alternative">
                </textarea>
                <div class="errormessage" *ngIf="controlHasError('required', 'notification_text')">
                  {{ "PLEASE_ENTER_NOTIFICATION_TEXT" | translate }}
                </div>
              </div>
            </div>
          </div>

          <!-- category -->
          <div class="col-md-12">
            <div class="form-group row clearfix">
              <div class="col-md-2">
                <label for="category" class="control-label">{{ "CATEGORY" | translate
                  }}<span class="required">*</span></label>
              </div>
              <div class="col-sm-4">
                <ng-select [searchable]="true" [clearable]="false" name="category" formControlName="category"
                  placeholder="{{ 'SELECT_CATEGORY' | translate }}">
                  <ng-option *ngFor="let item of category_list" [value]="item.id">
                    {{ item.name }}
                  </ng-option>
                </ng-select>
                <div class="errormessage" *ngIf="controlHasError('required', 'category')">
                  {{ "PLEASE_SELECT_CATEGORY" | translate }}
                </div>
              </div>
            </div>
          </div>

          <!-- event -->
          <div class="col-md-12">
            <div class="form-group row clearfix">
              <div class="col-md-2">
                <label for="event" class="control-label">{{ "EVENT" | translate
                  }}</label>
              </div>
              <div class="col-sm-4">
                <input type="text" name="event" formControlName="event" placeholder="{{ 'EVENT' | translate }}"
                  class="form-control form-control-alternative" />
              </div>
            </div>
          </div>

          <!-- Link to -->
          <div class="col-md-12">
            <div class="form-group row clearfix">
              <div class="col-md-2">
                <label for="link" class="control-label">{{ "LINK_TO" | translate
                  }}<span class="required">*</span></label>
              </div>
              <div class="col-sm-4">
                <ng-select [searchable]="true" [clearable]="false" name="link_to" formControlName="link_to"
                  placeholder="{{ 'SELECT_LINK' | translate }}">
                  <ng-option *ngFor="let link of link_list" [value]="link.id">
                    {{ link.name }}
                  </ng-option>
                </ng-select>
                <div class="errormessage" *ngIf="controlHasError('required', 'link_to')">
                  {{ "PLEASE_SELECT_LINK" | translate }}
                </div>
              </div>
            </div>
          </div>

          <div class="col-md-12">
            <div class="form-group row clearfix">
              <div class="col-md-2">
                <label class="control-label">{{ "ACTIVE" | translate }}</label>
              </div>
              <span> </span>
              <div class="col-sm-4">
                <input type="checkbox" class="cursor-pointer" formControlName="is_active" />
              </div>
            </div>
          </div>

          <div class="col-md-12">
            <div class="form-group row clearfix">
              <div class="col-md-2"></div>
              <div class="col-md-4">
                <button type="submit" class="btn btn-primary btn-with-icon save-profile globleSVGColorButtonChnage">
                  <svg class="btn-icon-width" id="Layer_1" data-name="Layer 1" xmlns="http://www.w3.org/2000/svg"
                    viewBox="0 0 100 100">
                    <defs>
                      <style>
                        .cls-1 {
                          fill: #fff;
                        }
                      </style>
                    </defs>
                    <path class="cls-1"
                      d="M77.78,0H11.11A11.1,11.1,0,0,0,0,11.11V88.89A11.1,11.1,0,0,0,11.11,100H88.89A11.1,11.1,0,0,0,100,88.89V22.22ZM50,88.89A16.67,16.67,0,1,1,66.67,72.22,16.68,16.68,0,0,1,50,88.89ZM66.67,33.33H11.11V11.11H66.67Z" />
                  </svg>&nbsp;{{ "SAVE" | translate }}
                </button>
              </div>
            </div>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
