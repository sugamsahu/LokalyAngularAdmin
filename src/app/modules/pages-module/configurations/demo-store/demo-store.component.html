<div class="header bg-gradient-danger pt-0 pt-md-0 header-bg-gradient-space">
  <div class="container-fluid">
    <div class="header-body"></div>
  </div>
</div>
<div class="container-fluid container-body-space">
  <div class="row">
    <div class="col-12">
      <div class="card shadow">
        <div class="card-header border-0 d-flex flex-wrap justify-content-between align-items-center">
          <h3 class="panel-title mb-0">
            <span class="head-img"><img src="assets/icons/demo_store.svg" /></span>
            <span class="align-text-top">
              {{help_details?.title ? help_details?.title: ("DEMO" | translate) +' '+ store_label }}
            </span>
            <img *ngIf="help_details?.is_active==1 && (help_details?.module_value || help_details?.attachment)"
              class="help-details-img-css" title="{{ 'STORE_DASHBOARD_HELP' | translate }}"
              src="assets/img/newdash/information-dark.svg" alt="information"
              (click)="openHelpInfoModel('dashboard')" />
          </h3>
          <a class="globleSVGColorButtonChnageReply back-btn" (mousedown)="cancelClick()">
            <svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" id="Capa_1"
              x="0px" y="0px" width="55px" height="45px" viewBox="0 0 612 612"
              style="enable-background: new 0 0 612 612" xml:space="preserve">
              <g>
                <g>
                  <g id="reply-all">
                    <path
                      d="M178.5,191.25v-76.5L0,293.25l178.5,178.5v-76.5l-102-102L178.5,191.25z M331.5,216.75v-102L153,293.25l178.5,178.5V367.2    C459,367.2,548.25,408,612,497.25C586.5,369.75,510,242.25,331.5,216.75z"
                      data-original="#000000" class="active-path" data-old_color="#24c9fc" fill="#24c9fc" />
                  </g>
                </g>
              </g>
            </svg>
          </a>
        </div>
        <form [formGroup]="formGroup" (ngSubmit)="onSubmit()">
          <div class="col-md-12 pt-3">
            <div class="row align-items-center">
              <div class="col-sm-2">
                <label for="distance" class="control-label">{{ "SELECT_DEMO_USER" | translate }}
                </label>
              </div>
              <div class="col-sm-4">
                <div class="form-group">
                  <ng-select required searchable="true" clearable="false" formControlName="demo_store"
                    (change)="getSelecteduser($event)">
                    <ng-option *ngFor="let item of demo_user_list" [value]="item" class="text-wrap">
                      {{ item.manager_name }} - {{ item.phone }}
                    </ng-option>
                  </ng-select>
                </div>
              </div>
            </div>
          </div>
          <!-- table -->
          <div class="col-md-12" *ngIf="demo_store_list.length != 0">
            <div class="form-group row clearfix">
              <div class="col-md-2"></div>
              <div class="col-md-6">
                <div class="table-responsive">
                  <table class="table table-bordered table-striped">
                    <thead>
                      <tr>
                        <th>{{ store_label + " Name" }}</th>
                        <th>{{ "CATEGORY_TYPE" | translate }}</th>
                      </tr>
                    </thead>
                    <tbody>
                      <tr class="gradeX" *ngFor="let item of demo_store_list">
                        <td>
                          <span>
                            <span>{{ item.store_name
                              }}<span *ngIf="item.store_name != null">({{ item.store_name }})</span></span>
                          </span>
                        </td>
                        <td>
                          <span>
                            <span>{{ item.category_type_name }}</span>
                          </span>
                        </td>
                      </tr>
                    </tbody>
                  </table>
                </div>
              </div>
            </div>
          </div>

          <div class="col-md-12">
            <div class="form-group row clearfix">
              <div class="col-md-2"></div>
              <div class="col-md-4">
                <button type="submit" class="btn btn-primary btn-with-icon save-profile globleSVGColorButtonChnage">
                  <svg class="btn-icon-width" id="Layer_1" data-name="Layer 1" xmlns="http://www.w3.org/2000/svg"
                    viewBox="0 0 100 100">
                    <defs>
                      <style>
                        .cls-1 {
                          fill: #fff;
                        }
                      </style>
                    </defs>
                    <path class="cls-1"
                      d="M77.78,0H11.11A11.1,11.1,0,0,0,0,11.11V88.89A11.1,11.1,0,0,0,11.11,100H88.89A11.1,11.1,0,0,0,100,88.89V22.22ZM50,88.89A16.67,16.67,0,1,1,66.67,72.22,16.68,16.68,0,0,1,50,88.89ZM66.67,33.33H11.11V11.11H66.67Z" />
                  </svg>&nbsp;{{ "SAVE" | translate }}
                </button>
              </div>
            </div>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
